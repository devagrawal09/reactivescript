# The editor tools (spec/11 CP-8e): build the crate natively and as WebAssembly, run the language server's LSP tests on
# both the server and the extension's bundle, and package the VS Code extension (one .vsix for every platform).
# A tag `vscode-v<version>` also publishes it: to the VS Marketplace by trusted publishing (OIDC, variables
# AZURE_CLIENT_ID and AZURE_TENANT_ID) and to Open VSX (secret OVSX_PAT), from the `release` environment.
name: editor

on:
  push:
    branches: [main]
    tags: ["vscode-v*"]
  pull_request:
    paths: ["compiler/**", "tooling/**", ".github/workflows/editor.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1   # solid-next's packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: rxc and its WebAssembly build
        run: |
          cargo build --release --manifest-path compiler/Cargo.toml
          cargo build --lib --release --target wasm32-unknown-unknown --manifest-path compiler/Cargo.toml
      - name: Solid next (the types the tests check against)
        run: sh ref/scripts/solid-next.sh && npm --prefix ref install
      - name: Language server tests
        working-directory: tooling/rx-language-server
        run: |
          npm ci
          node test/run.js
          RXC=$GITHUB_WORKSPACE/compiler/target/release/rxc node test/run.js
      - name: Package the extension
        working-directory: tooling/vscode-rx
        run: |
          npm ci
          npm run package
          SERVER=dist/server.js node ../rx-language-server/test/run.js
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: tooling/vscode-rx/*.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: build
    runs-on: ubuntu-latest
    # trusted publishing: no long-lived token for the Marketplace; the job's OIDC token signs it in to Microsoft Entra
    # through a federated credential on a managed identity that is a member of the publisher (tooling/vscode-rx/README.md)
    environment: release
    permissions:
      id-token: write
      contents: read
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }} # job-wide, so that a step's `if` can see whether it is set
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sign in to Microsoft Entra (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: VS Marketplace
        if: vars.AZURE_CLIENT_ID != ''
        run: npx --yes @vscode/vsce publish --azure-credential --packagePath *.vsix
      # Open VSX has no trusted publishing in its CLI yet (eclipse-openvsx/openvsx#1980 is server-side only): a token
      # until it does
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
