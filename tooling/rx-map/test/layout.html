<!doctype html>
<meta charset="utf-8">
<title>rx-map layout: one layout, three detail levels</title>
<!-- The 8-module tracker (fixtures/tracker.json) as the page draws it from layout.mjs: plates in bands (every
     dependency above), clusters on the dense plate, routes in the gutters; the three detail levels draw into the same
     boxes (nothing moves or resizes between them), picked by zoom with hysteresis; the overview's cards fill their
     plates without spilling. Results in #result. -->
<style>html, body { margin: 0; height: 100%; background: #000 } iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0 }</style>
<pre id="result" hidden></pre>
<script type="module">
import { pageHTML } from "../page.mjs";
const checks = [];
const check = (what, ok, got) => checks.push({ what, ok: !!ok, ...(ok ? {} : { got }) });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const done = () => { document.getElementById("result").textContent = JSON.stringify({ ok: checks.every(c => c.ok), checks }); };
try {
  const graph = await (await fetch("/test/fixtures/tracker.json")).json();
  const f = document.createElement("iframe");
  f.srcdoc = pageHTML(graph, { live: true });
  document.body.append(f);
  await new Promise(r => f.addEventListener("load", r, { once: true }));
  await sleep(300);
  const w = f.contentWindow, doc = f.contentDocument;
  const errors = []; w.addEventListener("error", e => errors.push(String(e.message)));
  // the levels' cross-fades off: what is checked is where each level ends up
  const still = doc.createElement("style"); still.textContent = "*, *::before, *::after { transition: none !important }"; doc.head.append(still);
  const M = w.__RX_MAP__, L = M.layout, P = k => L.plates.get(k);
  const name = mi => String(graph.modules[mi]).split("/").pop();
  M.flyTo(M.BW / 2, M.BH / 3, .8, 0); await sleep(150);
  // dependencies point up: a module's plate sits in a lower row than every module it needs
  const bad = [];
  for (const e of graph.edges) {
    const a = graph.nodes.find(n => n.id === (e.type === "read" ? e.to : e.from)), b = graph.nodes.find(n => n.id === (e.type === "read" ? e.from : e.to));
    if (!a || !b || a.mod === b.mod || (b.world && !b.from) || (a.world && !a.from)) continue;
    if (!(P(a.mod).row > P(b.mod).row)) bad.push(`${name(a.mod)} -> ${name(b.mod)}`);
  }
  check("every dependency between modules points up (its plate is in a higher row)", !bad.length, [...new Set(bad)]);
  const rows = L.rows.filter(r => !r.keys.includes("world"));
  check("modules at one depth sit side by side", rows.some(r => r.keys.length >= 3) && rows.length <= 5, rows.map(r => r.keys.map(name)));
  const rects = [...L.plates.values()];
  const ov = (p, q) => p.x < q.x + q.w && q.x < p.x + p.w && p.y < q.y + q.h && q.y < p.y + p.h;
  check("no two plates overlap", !rects.some((p, i) => rects.some((q, j) => j > i && ov(p, q))));
  const data = [...doc.querySelectorAll("#board > .frame.module")].find(p => /data\.rx$/.test(p.querySelector(".pname").textContent));
  const cl = [...data.querySelectorAll(":scope > .cluster")];
  check("the dense module is clustered by who uses it, with labels", cl.length >= 3 && cl.some(c => /used by/.test(c.querySelector(".clabel").textContent)), cl.map(c => c.querySelector(".clabel").textContent));
  // the DOM is where the layout says
  const off = [];
  for (const [id, t] of L.tokens) {
    if (t.role !== "named" && t.role !== "site") continue;
    const b = M.boxOf(M.anchor(id));
    // (offsets are whole px in the element's zoomed units: up to a zoom's worth of rounding)
    if (!b || Math.abs(b.l - t.x) > 3 || Math.abs(b.t - t.y) > 3 || Math.abs(b.r - b.l - t.w) > 3) off.push(id);
  }
  check("every token is drawn at its layout box", !off.length, off.slice(0, 6));
  // routes between plates stay out of plates (but for where they leave and enter)
  doc.getElementById("all").click(); await sleep(150); await M.draw();
  const inside = [];
  const paths = [...doc.querySelectorAll("#edges path.trunk")];
  for (const p of paths) {
    const len = p.getTotalLength();
    for (let t = 8; t < len - 8; t += 12) {
      const pt = p.getPointAtLength(t);
      if (rects.find(r => pt.x > r.x + 3 && pt.x < r.x + r.w - 3 && pt.y > r.y + 3 && pt.y < r.y + r.h - 3)) { inside.push([Math.round(pt.x), Math.round(pt.y)]); break; }
    }
  }
  check(`routes between plates (${paths.length}) run in the gutters, never through a plate`, paths.length > 5 && !inside.length, inside.slice(0, 5));
  doc.getElementById("all").click(); await sleep(50);
  // the two levels draw into the same boxes
  const boxes = () => [...doc.querySelectorAll("#board .frame, #board .chip.placed")].map(e => { const b = M.boxOf(e); return b ? [b.l, b.t, b.r, b.b].map(Math.round).join(",") : "-"; }).join(";");
  const ref = boxes(), extent = [M.BW, M.BH].join("x");
  const shown = {};
  for (const l of [1, 2, 1, 2]) {
    M.setLevel(l); await sleep(260);
    check(`level ${l}: every frame and token keeps its box; the board keeps its size`, boxes() === ref && [M.BW, M.BH].join("x") === extent);
    const vis = sel => [...doc.querySelectorAll(sel)].filter(e => +w.getComputedStyle(e).opacity > .5 && +w.getComputedStyle(e.closest(".frame.module > *") ?? e).opacity > .5).length;
    shown[l] = { cards: vis("#board .psum"), sites: vis("#board .chip.site.placed"), named: vis("#board .chip.placed:not(.site)"), strips: vis("#board .ostrip") };
  }
  check("the overview shows the cards, nothing inside the plates", shown[1].cards >= 8 && !shown[1].named && !shown[1].sites, shown[1]);
  check("the detail level shows everything: names, view sites, view text", !shown[2].cards && shown[2].named > 30 && shown[2].sites > 50 && shown[2].strips === doc.querySelectorAll("#board .ostrip").length, shown[2]);
  // the zoom picks the level, with hysteresis
  const fr = M.freeRect(), at = async s => { M.zoomAt(fr.cx, fr.cy, s / M.cam.s); await sleep(60); return M.level; };
  const seq = [];
  const { up, down } = M.LEVELS, b = (down[2] + up[1]) / 2;
  for (const s of [.2, b, up[1] + .01, b, down[2] - .01, b]) seq.push(await at(s));
  check("zoom picks the level, with hysteresis", JSON.stringify(seq) === "[1,1,2,2,1,1]", seq);
  // on screen at the switch: the font size, times the scale the page draws the detail at
  const px = sel => { const e = doc.querySelector(sel); if (!e) return Infinity; return parseFloat(w.getComputedStyle(e).fontSize) * M.zoomUnder(e) * up[1]; };
  const pxs = { name: px("#board .chip.placed:not(.site) .n"), tag: px("#board .frame:not(.module) > .flabel .ctag"), module: px("#board .frame.module > .flabel b"), site: px("#board .chip.site.placed .n"), strip: px("#board .ostrip .otext") };
  check("the detail's text reads at 11px or more right where it comes in (names, tags, module labels, sites, view text)", Object.values(pxs).every(v => v >= 11) && Number.isFinite(pxs.name + pxs.tag + pxs.module + pxs.site), pxs);
  check("the switch sits near the middle of the zoom range", up[1] >= .45 && up[1] <= .55, [up, down]);
  // the overview's cards fill their plates and never spill
  await at(.2); await sleep(260);
  const spill = [];
  const modules = [...L.plates.keys()].filter(k => k !== "world").map(mi => [mi, M.module(mi)]);
  for (const [mi, el] of modules) {
    const p = el.getBoundingClientRect(), c = el.querySelector(".psum .ps-in").getBoundingClientRect();
    if (c.left < p.left - 1 || c.right > p.right + 1 || c.top < p.top - 1 || c.bottom > p.bottom + 1) spill.push(name(mi));
  }
  check("overview: every card sits inside its plate", !spill.length, spill);
  check("overview: every card has the same parts (name, path, role bar, counts)", modules.every(([, c]) => c.querySelector(".ps-name") && c.querySelector(".ps-path") && c.querySelector(".ps-bars i") && c.querySelector(".ps-counts span")));
  const boundary = M.region("5:r6");
  const arms = () => [...boundary.querySelectorAll(":scope > .flabel .arm-list > span")].map(e => e.textContent);
  check("a boundary lists its arms in order", arms().join(" ") === "NotFound NotFoundHere ServerError", arms());
  // live: a failure caught by a boundary gets an arrow from the failing name to it; the overview's card counts it
  const detail = graph.nodes.find(n => n.name === "detail" && n.mod === 0 && !n.site), rv = w.__RX_VIEW__;
  rv.receive({ source: "rx-map", v: 1, type: "flush", seq: 1, at: 1, changes: [{ key: detail.key, name: "detail", error: "NotFound" }] });
  rv.receive({ source: "rx-map", v: 1, type: "boundary", region: graph.regions.find(r => r.id === "5:r6").key, state: "error", error: "NotFound", arm: "NotFoundHere" });
  rv.receive({ source: "rx-map", v: 1, type: "flight", key: graph.nodes.find(n => n.name === "stats" && n.mod === 0 && !n.site).key, state: "start", at: 2 });
  M.setLevel(2); await sleep(120); await M.draw();
  check("the reported arm is highlighted even if its name differs from the preview",
    boundary.querySelector(".selected-arm")?.textContent === "NotFoundHere");
  check("a caught failure: an arrow from the failing name to the boundary showing its fallback", doc.querySelectorAll("#edges path.caught").length >= 1, doc.querySelectorAll("#edges path.caught").length);
  M.setLevel(1); await sleep(120);
  const card = M.module(0).querySelector(".psum");
  check("overview: the module's card counts its failed and in-flight names, and shows it's busy", /1 failed/.test(card.textContent) && /1 in the air/.test(card.textContent) && card.classList.contains("busy") && card.classList.contains("failing"), card.querySelector(".ps-live").textContent);
  M.frameAll(0); await sleep(150);
  const fr2 = M.freeRect();
  const out = [[0, 0], [M.BW, 0], [0, M.BH], [M.BW, M.BH]].map(([x, y]) => M.toScreen(x, y)).filter(([x, y]) => x < fr2.l || x > fr2.r || y < fr2.t || y > fr2.b);
  check("frame shows everything, with a margin", !out.length, out);
  check("no page errors", !errors.length, errors);
} catch (e) { check(`threw: ${e?.stack ?? e}`, false); }
done();
</script>
