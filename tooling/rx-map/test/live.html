<!doctype html>
<meta charset="utf-8">
<title>rx-map live: page harness</title>
<!-- Mounts the users.rx map with ../live.mjs and posts made-up messages into it, the way live.mjs forwards a dev
     build's flushes. Results go in #result (run.mjs reads them with --dump-dom). ?shot leaves the map lit for a
     screenshot: a node selected and a ring mid-pulse. -->
<style>html, body { margin: 0; height: 100%; background: #000 } #host { position: fixed; inset: 0 } #static { display: none }</style>
<div id="host"></div>
<div id="static"></div>
<pre id="result" hidden></pre>
<script type="module">
import { register } from "../live.mjs";
import { pageHTML } from "../page.mjs";

const shot = new URLSearchParams(location.search).has("shot");
const checks = [];
const check = (what, ok, got) => checks.push({ what, ok: !!ok, ...(ok ? {} : { got }) });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const loaded = f => new Promise(r => f.addEventListener("load", r, { once: true }));
const done = () => {
  const out = document.getElementById("result");
  out.textContent = JSON.stringify({ ok: checks.every(c => c.ok), checks });
};

const sent = [];
addEventListener("message", e => { if (e.data?.source === "rx-map" && e.data.v === 1) sent.push(e.data); });
try {
  const graph = await (await fetch("/graph.json")).json();
  const K = name => graph.nodes.find(n => n.key === `examples/users.rx||${name}`);
  register(graph);
  check("register sets __RX__ with the graph and mount", globalThis.__RX__?.graphs?.length === 1 && typeof globalThis.__RX__.mount === "function");

  const dispose = globalThis.__RX__.mount(document.getElementById("host"));
  const frame = document.querySelector("#host iframe");
  await loaded(frame);
  const win = frame.contentWindow, doc = frame.contentDocument;
  const post = m => win.postMessage({ source: "rx-map", ...m }, "*");
  const chip = name => doc.querySelector(`#board .chip[data-id="${K(name).id}"]`);
  const badge = () => doc.getElementById("liveBadge")?.textContent;

  check("iframe fills the host", frame.style.width === "100%" && frame.style.height === "100%" && frame.style.border.startsWith("0"));
  check("live badge starts at 0", badge() === "live · 0 flushes", badge());
  check("live guide note", /Live\./.test(doc.getElementById("panel").textContent));
  await sleep(30);
  check("the page says hello to its host, v1", sent.some(m => m.type === "hello" && m.want?.includes("timeline")), sent);
  // role is shape, fill and icon: no role words on a token, an icon on every one
  const words = [...doc.querySelectorAll("#board .chip")].map(c => { const x = c.cloneNode(true); x.querySelectorAll(".n, .b, .lv, .d, .g, .pb").forEach(e => e.remove()); return x.textContent.trim(); }).filter(Boolean);
  check("no role text labels on chips", !doc.querySelector("#board .chip .k") && !words.length, words.slice(0, 5));
  check("every chip has an svg icon", [...doc.querySelectorAll("#board .chip")].every(c => c.querySelector(".ico svg")));
  const errors = [];
  win.addEventListener("error", e => errors.push(String(e.message)));

  post({ type: "flush", seq: 1, at: 10, changes: [
    { name: "rx:examples/users.rx||page", key: "examples/users.rx||page", preview: "2", origin: "click button \"Next\"" },
    { name: "rx:examples/users.rx||nope", key: "examples/users.rx||nope", preview: "1" },
    { name: "memo", key: null },
  ] });
  post({ type: "flight", key: "examples/users.rx||users", state: "start" });
  post({ type: "flight", key: "examples/users.rx||unknown", state: "start" });
  await sleep(50);
  check("badge counts the flush", badge() === "live · 1 flush", badge());
  check("changed chip pulses", chip("page").classList.contains("pulse"));
  check("changed chip shows its value", chip("page").querySelector(".lv")?.textContent === "2", chip("page").querySelector(".lv")?.textContent);
  check("unchanged chip has no value", !chip("query").querySelector(".lv"));
  check("in-flight chip glows", chip("users").classList.contains("flying"));
  check("in-flight chip has an orbit", !!chip("users").querySelector(".orb"));
  check("no errors from unknown keys", !errors.length, errors);

  post({ type: "flush", seq: 2, at: 20, changes: [
    { name: "rx:examples/users.rx||users", key: "examples/users.rx||users", preview: "[{id: 1, name: \"Ada\"}, {id: 2, name: \"Grace\"}]" },
    { name: "rx:examples/users.rx||total", key: "examples/users.rx||total", preview: "2" },
  ] });
  post({ type: "flight", key: "examples/users.rx||users", state: "land" });
  await sleep(1400);
  check("pulse ends after ~1.2s", !chip("page").classList.contains("pulse"));
  check("landed chip stops glowing", !chip("users").classList.contains("flying"));
  check("value stays after the pulse", chip("total").querySelector(".lv")?.textContent === "2");

  chip("users").click();
  await sleep(50);
  check("selecting tells the host", sent.some(m => m.type === "select" && m.key === K("users").key), sent.filter(m => m.type === "select"));
  check("highlighter tokens in the node panel", !!doc.querySelector("#panel pre.now .tk-state") && !!doc.querySelector("#panel pre.now .tk-pend"), doc.querySelector("#panel pre.now")?.innerHTML);
  const lv = doc.getElementById("liveval");
  check("panel shows Live value", /Live value/.test(doc.getElementById("panel").textContent) && lv?.querySelector("pre")?.textContent.startsWith("[{id: 1"), lv?.innerHTML);
  // only a JS import has a declaration: an equation that calls one shows none (round 5: "declared by default (no helper):
  // undefined" under pageAns, as `undefined != null` held)
  check("no declaration line on a node with none", !/declared (by|in) /.test(doc.getElementById("panel").textContent), doc.getElementById("panel").textContent);
  check("panel says how often", /changed 1×/.test(lv?.textContent ?? ""), lv?.textContent);
  post({ type: "flight", key: "examples/users.rx||users", state: "start" });
  await sleep(50);
  check("panel shows the request in the air", /in the air/.test(doc.getElementById("liveval")?.textContent ?? ""));
  post({ type: "flight", key: "examples/users.rx||users", state: "abandon" });
  post({ type: "flight", key: "examples/users.rx||users", state: "start" });
  await sleep(50);
  check("abandon then start keeps the glow", chip("users").classList.contains("flying"));

  // sound: off by default, toggled from the HUD, remembered
  const sb = doc.getElementById("soundBtn");
  check("sound is off by default", sb.getAttribute("aria-pressed") === "false");
  sb.click(); sb.click();
  check("mute persists in localStorage", win.localStorage.getItem("rx-map:sound") === "off" && sb.getAttribute("aria-pressed") === "false", win.localStorage.getItem("rx-map:sound"));

  // time travel (TRACE-CONTRACT v0.1)
  const ch = (name, preview, prev) => ({ key: K(name).key, name: `rx:${K(name).key}`, preview, ...(prev ? { prev } : {}) });
  post({ v: 1, type: "timeline", head: 3, viewing: null, capacity: 2000, steps: [
    { seq: 1, at: 10, cause: K("nextPage").key, changes: [ch("page", "2")] },
    { seq: 2, at: 20, changes: [ch("users", "[…]"), ch("total", "2")] },
    { seq: 3, at: 30, cause: K("search").key, changes: [ch("query", "\"ad\""), ch("saveError", '"boom"', '"none"')] },
  ] });
  await sleep(50);
  const scrub = doc.getElementById("scrub");
  check("timeline scrubber shows, live at the head", !scrub.hidden && /live/i.test(doc.getElementById("seqLabel").textContent) && /#3/.test(doc.getElementById("seqLabel").textContent), doc.getElementById("seqLabel").textContent);
  sent.length = 0;
  const track = doc.getElementById("track");
  track.focus();
  track.dispatchEvent(new win.KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
  await sleep(120);
  check("arrow key on the timeline sends travel", sent.some(m => m.type === "travel" && m.to === 2), sent);
  post({ v: 1, type: "step", from: 3, to: 1, direction: "back", changes: [ch("total", "0", "2"), ch("query", "\"\"", "\"ad\"")] });
  await sleep(60);
  const tlv = chip("total").querySelector(".lv");
  check("step back rolls the value back", tlv?.textContent === "0" && tlv.dataset.old === "2" && /down/.test(tlv.className), tlv?.outerHTML);
  check("step: viewing the past", doc.body.classList.contains("viewing") && /#1/.test(doc.getElementById("seqLabel").textContent), doc.getElementById("seqLabel").textContent);
  check("viewing: the badge says where, the HUD says the app is read-only", /^viewing #1 of 3$/.test(badge()) && /read-only until you resume/.test(doc.getElementById("viewNote")?.textContent ?? ""), [badge(), doc.getElementById("viewNote")?.textContent]);
  // page's first value came from outside the timeline's steps here only via seq 1; status first changes at seq 3 with a prev
  check("viewing: before a key's first change, it shows that change's prev", chip("saveError").querySelector(".lv")?.dataset.value === '"none"', chip("saveError").querySelector(".lv")?.dataset.value);
  check("viewing: the playhead sits on the viewed step", Math.abs(parseFloat(doc.getElementById("playhead").style.left) - 6) < 2, doc.getElementById("playhead").style.left);
  post({ v: 1, type: "step", from: 1, to: 2, direction: "forward", changes: [ch("total", "2", "0")], inexact: [K("users").key] });
  await sleep(50);
  check("viewing: a step's inexact keys say they can't rewind", chip("users").classList.contains("inexact") && /can't rewind/.test(chip("users").querySelector(".inx")?.textContent ?? ""));
  post({ v: 1, type: "travel-denied", to: 0, reason: "evicted" });
  await sleep(40);
  check("travel-denied shows a toast", doc.getElementById("toast").classList.contains("on") && /evicted/.test(doc.getElementById("toast").textContent));
  sent.length = 0;
  doc.getElementById("liveBtn").click();
  await sleep(30);
  check("LIVE button sends resume", sent.some(m => m.type === "resume"), sent);
  post({ v: 1, type: "resume", head: 3, changes: [ch("total", "2", "0"), ch("query", "\"ad\"", "\"\"")] });
  await sleep(60);
  check("resume: back to live, values forward", !doc.body.classList.contains("viewing") && chip("total").querySelector(".lv")?.textContent === "2" && /up/.test(chip("total").querySelector(".lv").className));
  post({ v: 2, type: "flush", seq: 9, at: 90, changes: [ch("page", "99")] });
  post({ v: 1, type: "no-such-message", x: 1 });
  await sleep(40);
  check("a v2 message and an unknown type are ignored", chip("page").querySelector(".lv")?.textContent === "2" && !errors.length, errors);

  // snapshot (contract v0.3): what the app shows when the map opens, applied quietly
  const loadingR = graph.regions.find(r => r.kind === "loading"), erroredR = graph.regions.find(r => r.kind === "errored");
  post({ v: 1, type: "snapshot",
    values: [{ key: K("users").key, preview: '[{id: 1, name: "Ada"}, {id: 2, name: "Grace"}, …3]' }, { key: K("saveError").key, preview: '""' }, { key: "nobody|x", preview: "1" }],
    flights: [{ key: K("query").key, since: 5 }],
    boundaries: [{ region: loadingR.key, state: "fallback" }, { region: erroredR.key, state: "error", error: "NotFound: no user 7" }] });
  await sleep(50);
  const ul = chip("users").querySelector(".lv");
  check("snapshot: values shown, quietly", ul?.dataset.value?.startsWith("[{id: 1") && !/up|down/.test(ul.className.replace("lv", "")) && chip("saveError").querySelector(".lv")?.dataset.value === '""', ul?.outerHTML);
  check("snapshot: a list reads as a count and its first items", ul?.classList.contains("list") && ul.querySelector(".lc")?.textContent === "5" && [...ul.querySelectorAll(".li")].map(x => x.textContent).join() === "Ada,Grace", ul?.innerHTML);
  check("snapshot: requests in the air orbit", chip("query").classList.contains("flying") && !!chip("query").querySelector(".orb"));
  const lf = doc.querySelector(".frame.loading.tripped"), ef = doc.querySelector(".frame.errored.tripped");
  check("snapshot: a loading boundary showing its fallback looks tripped", lf?.classList.contains("trip-loading") && /showing fallback/i.test(lf.querySelector(".trip")?.textContent ?? ""), lf?.className);
  check("snapshot: an errored boundary shows its error", ef?.classList.contains("trip-errored") && /NotFound: no user 7/.test(ef.querySelector(".trip")?.textContent ?? ""), ef?.className);
  post({ v: 1, type: "snapshot", values: [], flights: [], boundaries: [] });
  await sleep(30);
  check("snapshot: boundaries back to ok, flights cleared", !doc.querySelector(".frame.tripped") && !chip("query").classList.contains("flying"));

  // v0.4: failures, held writes, and what a tripped boundary says when opened
  post({ v: 1, type: "snapshot", values: [{ key: K("users").key, error: "ServerError: listUsers 503" }, { key: K("status").key, preview: '"3 users"' }], flights: [],
    boundaries: [{ region: erroredR.key, state: "error", error: "ServerError: listUsers 503" }], held: [{ key: K("page").key, by: [K("users").key], since: 3 }] });
  await sleep(40);
  check("a failed value: rose token, the error in its badge", chip("users").classList.contains("failed") && /listUsers 503/.test(chip("users").querySelector(".lverr")?.textContent ?? ""), chip("users").className);
  check("a held write: an amber mark that says what it waits on", chip("page").classList.contains("held") && /held.*waiting on users/i.test(chip("page").querySelector(".hm")?.textContent ?? ""), chip("page").querySelector(".hm")?.textContent);
  win.select(K("users").id); await sleep(30);
  check("the panel says it failed, and with what", /failed/i.test(doc.querySelector("#liveval .failbox")?.textContent ?? "") && /listUsers 503/.test(doc.getElementById("liveval").textContent), doc.getElementById("liveval")?.textContent);
  win.select(K("status").id); await sleep(30);
  check("a value from the snapshot is the value at open, not 'no change'", /value at open/.test(doc.getElementById("liveval")?.textContent ?? "") && !/No change seen/.test(doc.getElementById("panel").textContent), doc.getElementById("liveval")?.textContent);
  post({ v: 1, type: "released", key: K("page").key, at: 9 });
  post({ v: 1, type: "flush", seq: 3, at: 31, changes: [{ key: K("users").key, name: "x", preview: '[{id: 1, name: "Ada"}, {id: 2, name: "Grace"}, …3]' }, { key: K("total").key, name: "y", error: "TypeError: len of undefined" }] });
  await sleep(40);
  check("released clears the held mark", !chip("page").classList.contains("held") && !chip("page").querySelector(".hm"));
  check("a flush can fail a value and clear another's failure", chip("total").classList.contains("failed") && !chip("users").classList.contains("failed"), [chip("total").className, chip("users").className]);
  post({ v: 1, type: "held", key: K("query").key, by: [K("search").key], at: 10 });
  await sleep(20);
  check("a held message marks the token", /waiting on search/.test(chip("query").querySelector(".hm")?.textContent ?? ""));
  post({ v: 1, type: "released", key: K("query").key, at: 11 });
  const trip = doc.querySelector(".frame.errored.tripped > .flabel > .trip");
  trip?.click(); await sleep(30);
  check("a tripped boundary opens: state, error, and who can notify it", /showing fallback/i.test(doc.getElementById("panel").textContent) && /listUsers 503/.test(doc.getElementById("panel").textContent) && /Can fail from/.test(doc.getElementById("panel").textContent), doc.getElementById("panel").textContent.slice(0, 300));
  post({ v: 1, type: "boundary", region: erroredR.key, state: "ok", at: 12 });
  await sleep(30);
  check("a boundary message clears the trip", !doc.querySelector(".frame.errored.tripped"));
  // search: Enter selects the match and opens it; arrows go through the matches
  const q = doc.getElementById("q");
  // a tick between events, as between a person's keystrokes: a page may render on a microtask
  q.value = "s"; q.dispatchEvent(new win.Event("input", { bubbles: true })); await sleep(0);
  const n0 = doc.getElementById("qcount").textContent;
  q.dispatchEvent(new win.KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true })); await sleep(0);
  const n1 = doc.getElementById("qcount").textContent;
  q.value = "total"; q.dispatchEvent(new win.Event("input", { bubbles: true })); await sleep(0);
  q.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  await sleep(30);
  check("search: arrows cycle, Enter selects the match into the panel", /^1\//.test(n0) && /^2\//.test(n1) && chip("total").classList.contains("sel") && doc.querySelector('#ptabs [data-tab="node"]')?.textContent === "total", [n0, n1, doc.querySelector('#ptabs [data-tab="node"]')?.textContent]);
  q.value = ""; q.dispatchEvent(new win.Event("input", { bubbles: true }));
  // a mouse wheel (whole steps) zooms toward the pointer; a trackpad (small, fractional steps) pans; ctrl + wheel zooms
  const cv = doc.getElementById("canvas"), zp = () => doc.getElementById("zoomPct").textContent, tf = () => doc.getElementById("world").style.transform;
  const wheel = o => cv.dispatchEvent(new win.WheelEvent("wheel", { clientX: 600, clientY: 400, bubbles: true, cancelable: true, ...o }));
  const s0 = win.__RX_MAP__.cam.s;
  const z0 = zp(); wheel({ deltaY: 120 }); await sleep(40); const z1 = zp();
  const t1 = tf(); wheel({ deltaY: 3.5, deltaX: .5 }); await sleep(40); const z2 = zp(), t2 = tf();
  wheel({ deltaY: 120 }); await sleep(40); const z3 = zp();   // within a trackpad gesture: still a pan
  wheel({ deltaY: -120, ctrlKey: true }); await sleep(40); const z4 = zp();
  const t5 = tf(); wheel({ deltaY: 120, shiftKey: true }); await sleep(40); const z5 = zp();
  check("a mouse wheel zooms; a trackpad scroll pans (the whole gesture); ctrl + wheel zooms; shift + wheel pans", z1 !== z0 && z2 === z1 && t2 !== t1 && z3 === z1 && z4 !== z3 && z5 === z4 && tf() !== t5, [z0, z1, z2, z3, z4, z5]);
  // one notch is a gentle step, whatever the device sends: 3 lines, or an accelerated 1000 px
  const sa = win.__RX_MAP__.cam.s; wheel({ deltaY: -3, deltaMode: 1 }); await sleep(40); const sb1 = win.__RX_MAP__.cam.s;
  await sleep(450); wheel({ deltaY: -1000 }); await sleep(40); const sc = win.__RX_MAP__.cam.s;
  check("a wheel notch zooms ×1.13, however big its delta", Math.abs(sb1 / sa - 1.13) < .01 && Math.abs(sc / sb1 - 1.13) < .01, [sa, sb1, sc]);
  win.__RX_MAP__.zoomAt(600, 400, s0 / win.__RX_MAP__.cam.s); await sleep(40);
  post({ v: 1, type: "snapshot", values: [], flights: [], boundaries: [], held: [] });
  post({ v: 1, type: "flush", seq: 4, at: 32, changes: [{ key: K("total").key, name: "y", preview: "2" }] });
  await sleep(30);

  // pop-out: the same live map in its own window, fed through this one (no bridge to attach to: the relay)
  const realConnect = globalThis.__RX__.connect;
  delete globalThis.__RX__.connect;
  win.popOut();
  await sleep(300);
  const pw = win.open("", "rx-map-popout");
  const pd = pw?.document;
  check("pop-out: a window with the live map, caught up", !!pd?.getElementById("liveBadge") && pd.getElementById("liveBadge").textContent === doc.getElementById("liveBadge").textContent, pd?.getElementById("liveBadge")?.textContent);
  const pchip = name => pd.querySelector(`#board .chip[data-id="${K(name).id}"]`);
  check("pop-out: values carried over", pchip("users")?.querySelector(".lv")?.dataset.value?.startsWith("[{id: 1"), pchip("users")?.innerHTML.slice(0, 120));
  post({ v: 1, type: "flush", seq: 4, at: 40, changes: [ch("page", "7")] });
  await sleep(60);
  check("pop-out: the host's messages reach it", pchip("page")?.querySelector(".lv")?.dataset.value === "7" && pchip("page").classList.contains("pulse"));
  sent.length = 0;
  pd.getElementById("liveBtn").click();
  pw.__RX_VIEW__ && pw.eval?.("0");
  pd.getElementById("track").dispatchEvent(new pw.KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
  await sleep(120);
  check("pop-out: its travel goes to the host", sent.some(m => m.type === "travel"), sent);
  pw.close();
  await sleep(50);
  win.popOut();
  await sleep(300);
  const pw2 = win.open("", "rx-map-popout");
  check("pop-out: the button works again after closing one", !!pw2?.document?.getElementById("liveBadge"), pw2?.document?.title);
  pw2?.close();
  await sleep(50);
  globalThis.__RX__.connect = realConnect;
  post({ v: 1, type: "flush", seq: 5, at: 50, changes: [ch("page", "2")] });
  await sleep(40);
  check("pop-out closed: the map carries on", chip("page").querySelector(".lv")?.dataset.value === "2" && !errors.length, errors);

  // module replacement: plan → apply → done
  const ng = JSON.parse(JSON.stringify(graph));
  const gone = K("status");
  ng.nodes = ng.nodes.filter(n => n.id !== gone.id);
  ng.edges = ng.edges.filter(e => e.from !== gone.id && e.to !== gone.id);
  const plan = { kept: [K("page").key, K("users").key], reset: [K("query").key], rerun: [K("total").key], added: [], removed: [gone.key], moved: [],
    reasons: { [K("page").key]: "unchanged", [K("users").key]: "unchanged", [K("query").key]: "type-changed", [K("total").key]: "expr-changed", [gone.key]: "gone" } };
  post({ v: 1, type: "hmr", phase: "plan", id: "h1", modules: ["examples/users.rx"], graph: ng, plan });
  await sleep(60);
  doc.querySelector('#ptabs [data-tab="plan"]')?.click();
  await sleep(20);
  check("hmr plan: a Reload tab with reasons", /Reload/.test(doc.getElementById("ptabs").textContent) && /type-changed/.test(doc.getElementById("panel").textContent), doc.getElementById("panel").textContent.slice(0, 200));
  check("hmr plan: tokens marked", !!chip("page").querySelector(".pb") && chip("status").classList.contains("p-removed") && !!doc.querySelector("#board .frame.module.planned"));
  post({ v: 1, type: "hmr", phase: "apply", id: "h1" });
  await sleep(80);
  check("hmr apply: plate lifts, reset flips, rerun spins", !!doc.querySelector("#board .frame.module.hmr") && chip("query").classList.contains("h-reset") && chip("total").classList.contains("h-rerun") && chip("status").classList.contains("h-removed"));
  post({ v: 1, type: "hmr", phase: "done", id: "h1", changes: [ch("total", "3")] });
  await sleep(1300);
  check("hmr done: new graph swapped in, removed token gone", !chip("status") && !!chip("total"), doc.querySelectorAll("#board .chip").length);
  check("hmr done: values carried over and updated", chip("page").querySelector(".lv")?.textContent === "2" && chip("total").querySelector(".lv")?.textContent === "3", chip("total").querySelector(".lv")?.textContent);

  // a static page ignores every message
  const st = document.createElement("iframe");
  st.srcdoc = pageHTML(graph);
  document.getElementById("static").append(st);
  await loaded(st);
  st.contentWindow.postMessage({ source: "rx-map", type: "flush", seq: 1, at: 1, changes: [{ name: "rx:examples/users.rx||page", key: "examples/users.rx||page", preview: "2" }] }, "*");
  await sleep(50);
  const sd = st.contentDocument;
  check("static page: no live badge, no values, no pulse", !sd.getElementById("liveBadge") && !sd.querySelector(".lv, .pulse") && !sd.body.classList.contains("live"));
  check("static page: no Live guide note", !/Live\./.test(sd.getElementById("panel").textContent));
  check("static page: sound stays muted (persisted)", sd.getElementById("soundBtn").getAttribute("aria-pressed") === "false");
  sb.click();
  check("unmute persists", win.localStorage.getItem("rx-map:sound") === "on");
  sb.click();

  if (shot) {
    // leave it lit: users selected and in the air, total and page with values, a fresh pulse on status
    // run.mjs's virtual time budget is 8s: post the last flush ~0.4s before the screenshot, mid-pulse
    await sleep(Math.max(0, 7600 - performance.now()));
    // a screenshot does not catch an animation's frame: hold the ring where it is 0.25s in
    doc.head.append(Object.assign(doc.createElement("style"), { textContent: ".chip.pulse::before { animation-delay: -.25s !important; animation-play-state: paused !important }" }));
    post({ type: "flush", seq: 3, at: 30, changes: [
      { name: "rx:examples/users.rx||status", key: "examples/users.rx||status", preview: "\"page 2 of 4\"" },
      { name: "rx:examples/users.rx||query", key: "examples/users.rx||query", preview: "\"ad\"" },
    ] });
    done();
  } else {
    post({ type: "reset" });
    await sleep(50);
    check("reset clears values, glow and count", badge() === "live · 0 flushes" && !doc.querySelector("#board .lv, #board .flying"));

    // v0.9 calls: every ask (a flight) and run, with the JS imports it calls, how it ended and why
    const U = K("users").key;
    post({ v: 1, type: "flush", seq: 1, at: 100, changes: [ch("page", "2", "1")], origin: 'click button "Next"' });
    post({ v: 1, type: "flight", key: U, state: "start", at: 110, origin: 'click button "Next"', cause: [{ key: K("page").key, name: `rx:${K("page").key}`, prev: "1", value: "2" }] });
    post({ v: 1, type: "flight", key: U, state: "land", at: 150 });
    post({ v: 1, type: "flush", seq: 2, at: 151, changes: [ch("users", "[…]")] });
    post({ v: 1, type: "run", key: K("rename").key, id: "r1", state: "start", args: [7, "Ada"], at: 200 });
    post({ v: 1, type: "flight", key: U, state: "start", at: 210 });
    post({ v: 1, type: "flight", key: U, state: "abandon", at: 230, error: "RateLimited: slow down" });
    post({ v: 1, type: "run", key: K("rename").key, id: "r1", state: "error", error: "ServerError: 503", at: 240 });
    post({ v: 1, type: "flush", seq: 3, at: 241, changes: [ch("saveError", '"could not save Ada"', '""')] });
    post({ v: 1, type: "flight", key: U, state: "start", at: 300, cause: [{ key: K("query").key, name: `rx:${K("query").key}`, prev: '""', value: '"a"' }] });
    post({ v: 1, type: "flight", key: U, state: "abandon", at: 310 });
    await sleep(60);   // (the land above asked the bridge for a snapshot: its answer, with nothing in the air, comes first)
    post({ v: 1, type: "flight", key: U, state: "start", at: 311, retryAfterRejection: true });
    await sleep(60);
    doc.querySelector('#ptabs [data-tab="calls"]')?.click();
    await sleep(40);
    const rows = () => [...doc.querySelectorAll("#panel ol.calls > li.call")];
    const rowText = r => r?.textContent.replace(/\s+/g, " ") ?? "";
    const rs = rows();
    check("calls: a Calls tab, a row per ask and run, newest first", rs.length === 5 && rs[0].classList.contains("o-pending") && /in the air/.test(rowText(rs[0])), rs.map(rowText));
    const r1 = rs[4], run = rs[3], r2 = rs[2], r3 = rs[1];
    check("calls: an ask names its JS import, its question, its outcome, duration, landing step and cause",
      r1?.querySelector(".c-fn")?.textContent === "fetchUsers" && r1.classList.contains("o-ok") && /40 ms/.test(rowText(r1)) && /#2/.test(r1.querySelector(".c-seq")?.textContent ?? "")
      && /click button "Next"/.test(rowText(r1)) && /re-asked: page 1→2/.test(rowText(r1)) && r1.querySelector(".c-by a")?.textContent === "users", rowText(r1));
    check("calls: a rejected ask says its error; a refresh during an action is attributed to it, marked inferred",
      r2?.classList.contains("o-rejected") && /RateLimited: slow down/.test(r2.querySelector(".c-err")?.textContent ?? "") && /during action rename #1/.test(rowText(r2)) && !!r2.querySelector(".c-inf"), rowText(r2));
    check("calls: an unpublished rejection does not link to an unrelated frame",
      r2?.dataset.seq === "-1" && /no error frame recorded/.test(rowText(r2)), rowText(r2));
    check("calls: a retry after rejection is distinct from an explicit refresh",
      /retried after rejection/.test(rowText(rs[0])) && !rs[0]?.querySelector(".c-inf"), rowText(rs[0]));
    check("calls: a run with its args, its import, its error and the step it ended in",
      run?.querySelector(".c-fn")?.textContent === "saveUser" && /\(7, Ada\)/.test(rowText(run)) && run.classList.contains("o-rejected") && /ServerError: 503/.test(rowText(run)) && /#3/.test(run.querySelector(".c-seq")?.textContent ?? ""), rowText(run));
    check("calls: a superseded ask is stale", r3?.classList.contains("o-stale") && /re-asked: query/.test(rowText(r3)), rowText(r3));
    const sel = doc.getElementById("callFn");
    check("calls: the filter lists the imports that have calls", [...sel.options].map(o => o.textContent).join("|") === "all · 5|fetchUsers · 4|saveUser · 1", [...sel.options].map(o => o.textContent));
    sel.value = K("saveUser").key; sel.dispatchEvent(new win.Event("change", { bubbles: true }));
    await sleep(40);
    check("calls: filtered to one function", rows().length === 1 && rows()[0].querySelector(".c-fn")?.textContent === "saveUser", rows().map(rowText));
    sel.value = ""; sel.dispatchEvent(new win.Event("change", { bubbles: true }));
    await sleep(40);
    sent.length = 0;
    rows()[4]?.querySelector(".c-cause")?.click();
    await sleep(120);
    check("calls: clicking a row travels to the step it landed in", sent.some(m => m.type === "travel" && m.to === 2), sent);
    post({ v: 1, type: "resume", head: 3, changes: [] });
    await sleep(40);
    win.select(K("fetchUsers").id); await sleep(40);
    const ic = [...doc.querySelectorAll("#panel ol.calls.mini > li.call")];
    check("calls: a JS import's panel lists its last calls", ic.length === 4 && /Calls/.test(doc.getElementById("panel").textContent), ic.length);
    doc.querySelector("#panel button.c-all")?.click();
    await sleep(40);
    check("calls: show all opens the Calls tab filtered to it", doc.querySelector('#ptabs [data-tab="calls"]')?.getAttribute("aria-selected") === "true" && doc.getElementById("callFn")?.value === K("fetchUsers").key && rows().length === 4, [doc.getElementById("callFn")?.value, rows().length]);

    // the reload plan, verified: a kept name whose value changed was reseeded; Not carried comes first
    doc.querySelector("#ptabs .close").click();
    await sleep(20);
    const plan2 = { kept: [K("page").key, U, K("query").key], reset: [], rerun: [], added: [], removed: [], moved: [], reasons: { [K("page").key]: "unchanged", [U]: "unchanged", [K("query").key]: "unchanged" } };
    post({ v: 1, type: "hmr", phase: "plan", id: "h2", modules: ["examples/users.rx"], graph: { ...JSON.parse(JSON.stringify(graph)), title: "users.rx v2" }, plan: plan2 });
    post({ v: 1, type: "hmr", phase: "apply", id: "h2" });
    post({ v: 1, type: "flush", seq: 4, at: 400, origin: "hmr h2", changes: [ch("page", "1", "2")] });
    post({ v: 1, type: "hmr", phase: "done", id: "h2", changes: [], fallback: "refresh", uncarried: [U] });
    await sleep(1300);
    const ph = doc.getElementById("panel");
    const h3s = [...ph.querySelectorAll("h3")].map(h => h.textContent);
    check("plan: the panel opened on it; Not carried first, the sentence points at it", !doc.getElementById("side").classList.contains("closed") && /^Not carried/.test(h3s[0] ?? "") && /under Not carried lost their state/.test(ph.textContent), h3s);
    check("plan: a kept name that came back changed is reseeded, not kept", h3s.includes("Reseeded · 1") && h3s.includes("Kept · 1") && /page/.test([...ph.querySelectorAll("h3")].find(h => /Reseeded/.test(h.textContent))?.nextElementSibling?.nextElementSibling?.textContent ?? ""), h3s);
    post({ type: "reset" });
    await sleep(40);
    check("plan: after the app reloads, a panel the plan opened closes again (no Guide popping up)", doc.getElementById("side").classList.contains("closed"), doc.getElementById("side").className);
    check("calls: a reset clears them", (doc.querySelector('#ptabs [data-tab="calls"]')?.click(), await sleep(30), rows().length === 0));
    check("the header title follows the graph drawn", /^users\.rx v2$/.test(doc.querySelector("header h1 small")?.textContent ?? "") && doc.title === `rx-map · ${doc.querySelector("header h1 small").textContent}`, [doc.title, doc.querySelector("header h1 small")?.textContent]);
    doc.querySelector("#ptabs .close").click();
    // pop-out, direct: it attaches to the app page's bridge (__RX__.connect), so it outlives the dock's iframe, says
    // "disconnected" when the feed stops, and says hello again after the app reloads
    const feed = { posts: [], sends: [] };
    const bridge = tag => postTo => {
      feed.posts.push(postTo);
      return {
        send(m) {
          feed.sends.push({ tag, ...m });
          if (m.type !== "hello") return;
          postTo({ source: "rx-map", v: 1, type: "snapshot", values: [{ key: K("total").key, preview: "41" }, { key: K("users").key, error: "ServerError: 503" }], flights: [], boundaries: [], held: [{ key: K("page").key, by: [K("users").key], since: 1 }] });
          postTo({ source: "rx-map", v: 1, type: "timeline", head: 0, viewing: null, steps: [], capacity: 2000 });
        },
        graph: () => graph,
        close() {},
      };
    };
    const rxBefore = globalThis.__RX__;
    globalThis.__RX__.connect = bridge("a");
    win.popOut();
    await sleep(400);
    const qw = win.open("", "rx-map-popout"), qd = qw.document;
    const qchip = name => qd.querySelector(`#board .chip[data-id="${K(name).id}"]`);
    check("pop-out direct: says hello to the app's bridge", feed.sends.some(m => m.tag === "a" && m.type === "hello"), feed.sends);
    check("pop-out direct: current values, failures and held writes on open", qchip("total")?.querySelector(".lv")?.dataset.value === "41" && qchip("users")?.classList.contains("failed") && /503/.test(qchip("users")?.querySelector(".lverr")?.textContent ?? "") && /waiting on users/.test(qchip("page")?.querySelector(".hm")?.textContent ?? ""), qchip("page")?.innerHTML.slice(-200));
    dispose();
    check("dispose removes the iframe", !document.querySelector("#host iframe"));
    feed.posts.at(-1)({ source: "rx-map", v: 1, type: "flush", seq: 1, at: 1, changes: [ch("total", "42")] });
    await sleep(60);
    check("pop-out direct: keeps streaming after the dock's iframe is gone", qchip("total")?.querySelector(".lv")?.dataset.value === "42" && /^live/.test(qd.getElementById("liveBadge").textContent), qd.getElementById("liveBadge").textContent);
    globalThis.__RX__ = undefined;
    await sleep(1200);
    check("pop-out direct: says disconnected when the feed stops", /^disconnected/.test(qd.getElementById("liveBadge").textContent) && qd.body.classList.contains("disconnected"), qd.getElementById("liveBadge").textContent);
    globalThis.__RX__ = { ...rxBefore, connect: bridge("b") };
    await sleep(1200);
    check("pop-out direct: reconnects and says hello again after the app reloads", feed.sends.some(m => m.tag === "b" && m.type === "hello") && /^live/.test(qd.getElementById("liveBadge").textContent) && qchip("total")?.querySelector(".lv")?.dataset.value === "41", qd.getElementById("liveBadge").textContent);
    qw.close();
    globalThis.__RX__ = rxBefore; globalThis.__RX__.connect = realConnect;
    done();
  }
} catch (e) {
  check(`threw: ${e?.stack ?? e}`, false);
  done();
}
</script>
