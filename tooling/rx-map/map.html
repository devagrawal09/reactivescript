<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rx-map · <!--__TITLE__--></title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --card: #1b2029; --line: #2a303b; --text: #e6e8ec; --dim: #8b93a3;
    /* colour is the role family, and nothing else */
    --state: #5b8cff; --derived: #2dd4bf; --imper: #fb923c; --outside: #94a3b8; --struct: #b48cf8;
    /* two accents for what cuts across families: pending and failure */
    --pending: #fbbf24; --fail: #fb7185;
    /* reserved for diff status, used nowhere else */
    --d-add: #22c55e; --d-del: #ef4444; --d-chg: #e879f9;
    /* aliases the rest of the page uses */
    --comp: var(--struct); --aeq: var(--pending); --err: var(--fail);
  }
  * { box-sizing: border-box }
  body { display: flex; flex-direction: column }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: nowrap; white-space: nowrap }
  header > * { flex-shrink: 0 }
  header h1 { flex-shrink: 1; min-width: 60px; overflow: hidden; text-overflow: ellipsis }
  header .stats { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: right }
  header .spacer { flex-shrink: 1; min-width: 0 }
  header h1 { font-size: 14px; margin: 0; font-weight: 600 }
  header h1 small { color: var(--dim); font-weight: 400; margin-left: 6px }
  header input[type=search] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; width: 200px }
  header label { color: var(--dim); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; user-select: none }
  header button, aside button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer }
  header button:hover, aside button:hover { border-color: var(--dim) }
  .spacer { flex: 1 }
  @media (max-width: 1100px) { header input[type=search] { width: 140px } }
  #wrap { display: flex; flex: 1; min-height: 0 }
  #canvas { flex: 1; overflow: auto; position: relative }
  #board { position: relative; padding: 16px 20px 80px; max-width: 1600px; margin: 0 auto }
  .level { display: grid; gap: 24px; margin-bottom: 30px; position: relative; z-index: 1 }
  .kids { display: grid; gap: 16px; margin-top: 18px; align-items: start }
  .kids > .frame { margin-top: 0 !important }
  .mounts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px }
  .mounts > .frame { margin-top: 0 !important }
  .chips.named + .chips.sites { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line) }
  .worldrow { margin-bottom: 22px; position: relative; z-index: 1 }
  .wgroups { display: flex; gap: 10px 26px; flex-wrap: wrap }
  .wfile { color: var(--dim); font-size: 11px; margin-bottom: 4px }
  svg#edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0 }
  aside { width: clamp(250px, 26vw, 360px); border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px; flex-shrink: 0; position: relative }
  aside.closed { display: none }
  aside { padding: 0 }
  #panel { padding: 12px 14px 14px }
  #ptabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2 }
  #ptabs [role=tab] { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--dim); padding: 9px 10px 7px; cursor: pointer; font: inherit; white-space: nowrap; flex-shrink: 0 }
  #ptabs [role=tab][data-tab=node] { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, monospace; font-size: 12px }
  #ptabs [role=tab][aria-selected=true] { color: var(--text); border-bottom-color: var(--text) }
  #ptabs [role=tab]:hover { color: var(--text) }
  #ptabs .close { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 18px; padding: 0 12px; cursor: pointer }
  #ptabs .close:hover { color: var(--text) }
  header button.on { border-color: var(--dim); background: var(--line) }
  aside h2 { margin: 0 0 2px; font-size: 16px; display: flex; gap: 8px; align-items: center }
  aside h3 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600 }
  aside pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 8px 0; white-space: pre-wrap; word-break: break-word }
  aside ul { list-style: none; margin: 0; padding: 0 }
  aside li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline }
  aside a { color: #7aa7ff }
  aside .hint { color: var(--dim) }
  aside .tag { font-size: 10px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim) }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px }

  .column { display: flex; flex-direction: column; gap: 14px; min-width: 260px; max-width: 520px; position: relative; z-index: 1 }
  .column > .title { font-weight: 600; color: var(--dim); font-size: 12px; padding: 0 2px }
  .column > .title b { color: var(--text) }
  .world { border: 1px dashed #4b5563; border-radius: 10px; padding: 10px; background: rgba(0,0,0,.15) }
  .world .title { margin-bottom: 6px }

  .frame { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 18px; background: rgba(255,255,255,.025); position: relative }
  .frame > .flabel { font-size: 11px; color: var(--dim); margin-bottom: 12px; display: flex; gap: 6px; align-items: center }
  .frame > .flabel b { color: var(--text); font-weight: 600; font-size: 12px }
  .frame .frame { background: rgba(255,255,255,.012) }
  .frame.component { border-color: color-mix(in srgb, var(--comp) 55%, transparent); border-width: 1.5px }
  .frame.component > .flabel { color: var(--comp) }
  /* control flow: a colour per construct. Branches and rows are solid; boundaries are dashed */
  :root { --if: #38bdf8; --for: #cbd5e1; --load: var(--pending); --errb: var(--fail) }
  .frame.then, .frame.else { --fc: var(--if) } .frame.for { --fc: var(--for) } .frame.loading { --fc: var(--load) } .frame.errored { --fc: var(--errb) }
  .frame.ctl { border: 1.5px solid color-mix(in srgb, var(--fc) 50%, transparent); border-left-width: 4px; background: color-mix(in srgb, var(--fc) 5%, transparent) }
  .frame.loading, .frame.errored { border-style: dashed; border-left-style: solid }
  .frame.for { box-shadow: 5px 5px 0 -1.5px var(--bg), 5px 5px 0 0 color-mix(in srgb, var(--fc) 35%, transparent) }
  .ctag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 7px; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 600;
    color: var(--fc); background: color-mix(in srgb, var(--fc) 16%, #161a21); border: 1px solid color-mix(in srgb, var(--fc) 55%, transparent); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis }
  .ctag::before { font-size: 10px; letter-spacing: .05em; opacity: .85 }
  .frame.then > .flabel .ctag::before, .frame.else > .flabel .ctag::before { content: "⑂ BRANCH" }
  .frame.for > .flabel .ctag::before { content: "≡ ROWS" }
  .frame.loading > .flabel .ctag::before { content: "⧗ LOADING" } .frame.errored > .flabel .ctag::before { content: "⚠ ERRORED" }
  .ctag.sel { box-shadow: 0 0 0 2px #fff } .ctag.lit { outline: 1px solid #fff }
  .frame > .flabel { flex-wrap: wrap }
  .notifiers { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 11.5px; color: var(--fc) }
  .notifiers .nref { font: 12px ui-monospace, Menlo, monospace; background: color-mix(in srgb, var(--fc) 10%, #161a21); border: 1px dashed color-mix(in srgb, var(--fc) 60%, transparent); color: var(--text); border-radius: 999px; padding: 1px 8px; cursor: pointer }
  .notifiers .nref:hover { border-style: solid }
  .notifiers.none { color: var(--dim); font-style: italic }
  .frame.children, .frame.imported { border-color: color-mix(in srgb, var(--comp) 35%, transparent); display: inline-block; padding: 3px 8px; border-radius: 6px }
  .frame.children > .flabel, .frame.imported > .flabel { margin: 0 }
  .frame.module { background: transparent; border-color: #3a4150 }
  .frame.module > .flabel b { font-family: ui-monospace, Menlo, monospace }

  .chips { display: flex; flex-wrap: wrap; gap: 10px 12px; justify-content: center }
  .chips + .chips { margin-top: 22px }   /* a row per step of dependency: room for the arrows between them */
  .chip { --c: var(--outside); display: inline-flex; gap: 5px; align-items: center; padding: 6px 14px 6px 12px; border-radius: 999px; cursor: pointer;
    background: color-mix(in srgb, var(--c) 16%, #161a21); border: 1.5px solid color-mix(in srgb, var(--c) 70%, transparent); color: var(--text);
    white-space: nowrap; transition: opacity .12s, box-shadow .12s; position: relative }
  .chip .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--c); font-weight: 700 }
  .chip .n { font-family: ui-monospace, Menlo, monospace; font-size: 13.5px }
  .chip .b { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.35); color: var(--dim) }
  .chip.site { border-radius: 7px; border-style: solid; border-width: 1px; padding: 4px 10px }
  .chip.site .n { font-size: 12.5px }
  .chip.async { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 24%, #161a21) 0 5px, color-mix(in srgb, var(--c) 7%, #161a21) 5px 10px) }
  .chip .g { font-size: 12px; font-weight: 700; line-height: 1 }
  .chip .g.gp { color: var(--pending) }
  .chip .g.gq { color: var(--c); border: 1px solid currentColor; border-radius: 50%; width: 15px; height: 15px; display: inline-grid; place-items: center; font-size: 10px }
  .chip .chg { text-decoration: underline 2px var(--d-chg); text-underline-offset: 3px }
  .chip .g.chg { box-shadow: 0 2px 0 0 var(--d-chg) }
  .flabel .chip, aside .chip, #legend .chip { padding: 2px 9px 2px 7px }
  .flabel .chip .n { font-size: 12.5px }
  .chip:focus-visible { outline: 2px solid #fff; outline-offset: 2px }
  .chip.io::after { content: "↗"; position: absolute; top: -8px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: #e5e7eb; color: #0f1115; font: 700 11px/16px system-ui; text-align: center; box-shadow: 0 0 0 2px var(--bg) }
  .chip.io.chg-io::after { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--d-chg) }
  .chip.trust { border-style: dashed }
  .chip.hit { box-shadow: 0 0 0 2px #fff }
  .chip.sel { box-shadow: 0 0 0 2px #fff, 0 0 14px 2px color-mix(in srgb, var(--c) 70%, transparent) }
  .chip.compref { border-radius: 6px }
  body.focus #board .chip:not(.lit) { opacity: .3 }
  body.focus #board .frame > .flabel:not(.lit) { opacity: .35 }
  body.focus #board .frame.ctl > .flabel { opacity: 1 }
  body.focus #board .ctag:not(.lit), body.focus #board .notifiers { opacity: .35 }
  body.focus #board .flabel:has(.ctag.lit) .notifiers { opacity: 1 }
  .chip.cread { --c: var(--fc); padding: 2px 9px; border-style: dashed }
  .chip.cread .n { font-size: 12px }
  .flabel.lit { opacity: 1 }

  /* families: state (sources) · derived (equations, props, view reads) · imperative (actions, handlers, effects) ·
     outside (JS, server fns, plain fns) · structure (components, contexts, props passed) · failure (error classes) */
  .k-source, .k-asource { --c: var(--state) }
  .k-eq, .k-aeq, .k-props, .k-reader { --c: var(--derived) }
  .k-action, .k-handler, .k-effect, .k-apply { --c: var(--imper) }
  .k-import, .k-server, .k-fn { --c: var(--outside) }
  .k-comp, .k-context, .k-prop, .k-provide { --c: var(--struct) }
  .k-errclass { --c: var(--fail) }

  .legend h4 { margin: 8px 0 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em }
  .legend h4:first-child { margin-top: 0 }
  .legend .grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center }
  .legend .grid > .chip { justify-self: start }
  .legend .rows { display: grid; gap: 1px }
  .lrow { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "sample cnt" "text text"; gap: 2px 8px; align-items: center; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 6px; color: inherit; font: inherit; cursor: pointer; width: 100% }
  .lrow > :first-child { grid-area: sample; justify-self: start }
  .lrow > .hint { grid-area: text; font-size: 12px; line-height: 1.35 }
  .lrow > :last-child { grid-area: cnt }
  .lrow:hover:not(.fixed):not(.none) { background: var(--card); border-color: var(--line) }
  .lrow.off > :first-child, .lrow.off .hint { opacity: .35 }
  .lrow.off .hint { text-decoration: line-through }
  .lrow .cnt { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums }
  .lrow.none { opacity: .4; cursor: default }
  .lrow.fixed { cursor: default }
  .legend h4 { display: flex; align-items: center; justify-content: space-between }
  .lall { display: inline-flex; gap: 4px; text-transform: none; letter-spacing: 0 }
  .lall button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 5px; padding: 0 6px; font-size: 11px; cursor: pointer }
  .lall button:hover { color: var(--text) }
  .legend svg { display: block }
  .stats { color: var(--dim); font-size: 12px }

  /* diff mode */
  .chip.d-added { outline: 2.5px solid var(--d-add); outline-offset: 3px }
  .chip.d-changed { outline: 2.5px solid var(--d-chg); outline-offset: 3px }
  .chip.d-removed { outline: 2.5px dashed var(--d-del); outline-offset: 3px; opacity: .55 }
  .chip.d-removed .n { text-decoration: line-through 2px var(--d-del) }
  .chip .d { position: absolute; top: -10px; left: -8px; width: 17px; height: 17px; border-radius: 50%; font: 800 12px/17px system-ui; text-align: center; color: #0f1115; box-shadow: 0 0 0 2px var(--bg) }
  .chip.d-added .d { background: var(--d-add) } .chip.d-changed .d { background: var(--d-chg) } .chip.d-removed .d { background: var(--d-del) }
  .frame.d-added { outline: 2.5px solid var(--d-add); outline-offset: 4px }
  .frame.d-removed { outline: 2.5px dashed var(--d-del); outline-offset: 4px; opacity: .6 }
  body.v-before .d-added, body.v-after .d-removed { display: none !important }
  #summary li { cursor: pointer; padding: 3px 4px; border-radius: 4px; display: block }
  #summary li:hover { background: var(--card) }
  #summary code { color: var(--text) }
  .was { color: var(--d-chg) }
  aside pre.before { border-color: var(--d-del); opacity: .85 }
  #diffbar { display: none; gap: 6px; align-items: center }
  #hiddenBtn { color: #fbbf24 }
  body.diff #diffbar { display: inline-flex }
  #diffbar select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px }

  /* live mode: what a running dev build's flushes change. White for a change, amber for in flight; the diff colours
     stay reserved */
  #liveBadge { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 8px; background: var(--card); font-variant-numeric: tabular-nums }
  #liveBadge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .45 }
  #liveBadge.beat::before { animation: rx-beat .6s ease-out }
  @keyframes rx-beat { from { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,.8) } to { opacity: .45; box-shadow: 0 0 0 6px rgba(255,255,255,0) } }
  .chip.pulse::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 2px solid #fff; pointer-events: none; animation: rx-pulse 1.2s ease-out forwards }
  @keyframes rx-pulse { 0% { opacity: 1; transform: scale(1) } 60% { opacity: .55 } 100% { opacity: 0; transform: scale(1.08, 1.3) } }
  .chip .lv { font: 11px/1.3 ui-monospace, Menlo, monospace; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 0 5px; max-width: 20ch; overflow: hidden; text-overflow: ellipsis }
  .chip.flying { box-shadow: 0 0 0 2px var(--pending); animation: rx-fly 1.1s ease-in-out infinite alternate }
  .chip.sel.flying { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--pending) }
  @keyframes rx-fly { from { filter: drop-shadow(0 0 1px var(--pending)) } to { filter: drop-shadow(0 0 7px var(--pending)) } }
  #liveval pre { margin: 4px 0 }
</style>
</head>
<body>
<header>
  <h1>rx-map <small class="mono"><!--__TITLE__--></small></h1>
  <input type="search" id="q" placeholder="find a name…  (/)">
  <label><input type="checkbox" id="all"> all edges</label>
  <button id="hiddenBtn" hidden title="open the legend to show them again"></button>
  <span id="diffbar"><select id="view"><option value="both">before + after</option><option value="before">before</option><option value="after">after</option></select></span>
  <span class="spacer"></span>
  <span class="stats" id="stats"></span>
  <span id="panelBtns"></span>
</header>
<div id="wrap">
  <div id="canvas"><div id="board"><svg id="edges"></svg></div></div>
  <aside id="side"><div id="ptabs" role="tablist"></div><div id="panel" role="tabpanel"></div></aside>
</div>
<script>
const G = /*__GRAPH__*/null;
const LIVE = /*__LIVE__*/false;

// ---- vocabulary ------------------------------------------------------------------------------------------------
const KIND = {
  source:  { k: "source", label: "source", what: "State. Only a source is written, with :=" },
  asource: { k: "source", label: "source that awaits", what: "A source with a standing question (source x = await …): re-asks until written; can be pending" },
  eq:      { k: "eq", label: "equation", what: "x = e: always true, recomputes when what it reads changes" },
  aeq:     { k: "eq", label: "async equation", what: "An equation over an await: a question, can be pending and can fail" },
  action:  { k: "action", label: "action", what: "One change across its awaits; its writes are held until it returns" },
  fn:      { k: "fn", label: "function", what: "A plain function: lifted, or instantiated where it declares nodes" },
  server:  { k: "server fn", label: "server function", what: "Runs on the server; the call site decides query vs mutation" },
  context: { k: "context", label: "context", what: "Declared, provided above, used below; read-only" },
  errclass:{ k: "error", label: "error class", what: "A declared failure class (R-f-1); crosses the wire" },
  comp:    { k: "component", label: "component", what: "A region that owns everything declared in it" },
  props:   { k: "props", label: "props", what: "A component's inputs: one live structured equation" },
  import:  { k: "js", label: "JS import", what: "Outside the program: a JS module, trusted through pure / fails / .d.rx" },
  reader:  { k: "view", label: "view read", what: "A markup position that reads reactive values" },
  handler: { k: "on", label: "handler", what: "Imperative scope: every read is a snapshot, writes are legal" },
  prop:    { k: "prop", label: "prop passed", what: "A value handed to a child component" },
  effect:  { k: "effect", label: "effect", what: "Compute half tracked, apply half runs after the instant settles" },
  apply:   { k: "apply", label: "effect apply", what: "" },
  provide: { k: "provide", label: "provide", what: "Provides a context to the regions below" },
};
const FRAME = { component: "component", for: "for each", then: "if ▸ then", else: "else", loading: "loading", errored: "errored", children: "renders", imported: "renders (imported)" };
const EDGE = {
  // reads: derived teal; the dash says how
  "read:tracked":  { c: "#2dd4bf", d: "",        w: 1.7, label: "tracked read — points at what it reads; re-runs when that changes" },
  "read:snapshot": { c: "#2dd4bf", d: "5 4",     w: 1.2, label: "snapshot read — value now, never re-runs" },
  "read:pre":      { c: "#2dd4bf", d: "1 4",     w: 1.6, label: "pre — the value before its last change" },
  "read:probe":    { c: "#fbbf24", d: "6 3 1 3", w: 1.5, label: "probe — latest / pending?, reads ahead, never holds" },
  // writes: imperative orange
  "write:write":   { c: "#fb923c", d: "",        w: 1.9, label: "write :=" },
  "write:optimistic": { c: "#fb923c", d: "7 4",  w: 1.9, label: "guess — shown now, confirmed or reverted by the answer" },
  "write:refresh": { c: "#fb923c", d: "7 3 1 3", w: 1.7, label: "refresh — re-asks the question" },
  "write:affects": { c: "#fb923c", d: "1 4",     w: 1.9, label: "affects — marks it pending? for the action" },
  // structure violet
  "write:provide": { c: "#b48cf8", d: "",        w: 1.5, label: "provides a context" },
  "passes":        { c: "#b48cf8", d: "4 3",     w: 1.4, label: "passes a prop" },
  "renders":       { c: "#b48cf8", d: "",        w: 1.1, label: "renders a component" },
  // boundaries: the pending and failure accents
  "notifies:loading": { c: "#fbbf24", d: "2 4", w: 1.8, label: "can make a loading boundary show its fallback: pending, read below it" },
  "notifies:errored": { c: "#fb7185", d: "2 4", w: 1.8, label: "can make an errored boundary show its fallback: an await below it can reject" },
  // outside slate
  "call":          { c: "#94a3b8", d: "",        w: 1.1, label: "calls" },
};
const edgeStyle = e => e.type === "notifies" ? EDGE[`notifies:${e.boundary}`] : e.type === "read" ? EDGE[e.probe ? "read:probe" : `read:${e.mode}`] : e.type === "write" ? (EDGE[`write:${e.op}`] ?? EDGE["write:write"]) : EDGE[e.type];

const FAMILY = { state: "--state", derived: "--derived", imperative: "--imper", outside: "--outside", structure: "--struct", failure: "--fail" };
const fam = f => `<b style="color:var(${FAMILY[f]})">${f}</b> · `;
const THINGS = [["source", "state"], ["asource", "state"], ["eq", "derived"], ["aeq", "derived"], ["props", "derived"], ["action", "imperative"], ["import", "outside"], ["server", "outside"], ["fn", "outside"], ["context", "structure"], ["errclass", "failure"]];
const SITES = [["reader", "derived"], ["handler", "imperative"], ["effect", "imperative"], ["prop", "structure"], ["provide", "structure"]];
const sampleExtra = k => (k === "asource" || k === "aeq" ? "async" : k === "import" ? "trust" : "");
const sampleGlyphs = k => (k === "asource" ? GP + GQ : k === "aeq" ? GP : "");
const legendHTML = () => `<div class="legend"><h2>Legend</h2>
  <p class="hint" style="margin-top:0">Colour is the role; marks are properties, and combine on any role. Click a row to show or hide it on the map.</p>
  ${lsection("Things, by role", THINGS.map(([k]) => `k:${k}`), THINGS.map(([k, f]) => lrow(`k:${k}`, chipSample(k, sampleExtra(k), sampleGlyphs(k)), fam(f) + KIND[k].what, kindCount[k] ?? 0)).join("")
    + `<div class="lrow fixed">${chipSample("comp")}<span class="hint">${fam("structure")}${KIND.comp.what} (always shown)</span><span class="cnt">${kindCount.comp ?? 0}</span></div>`)}
  ${lsection("View sites, by role", SITES.map(([k]) => `k:${k}`), SITES.map(([k, f]) => lrow(`k:${k}`, chipSample(k, "site"), fam(f) + KIND[k].what, kindCount[k] ?? 0)).join(""))}
  <h4>Marks</h4><div class="rows">
    <div class="lrow fixed">${chipSample("eq", "async", GP)}<span class="hint"><b style="color:var(--pending)">⧗</b> and stripes: can be pending (it awaits)</span><span></span></div>
    <div class="lrow fixed">${chipSample("source", "", GQ)}<span class="hint"><b>?</b> re-asks a standing question until written</span><span></span></div>
    <div class="lrow fixed">${chipSample("action", "io")}<span class="hint"><b>↗</b> touches the world (io)</span><span></span></div>
    <div class="lrow fixed">${chipSample("import", "trust")}<span class="hint">dashed border: a trust point, the checker sees only its signature</span><span></span></div>
    <div class="lrow fixed">${chipSample("asource", "async io", GP + GQ, "x")}<span class="hint">they combine: a source that awaits, re-asks and touches the world</span><span></span></div>
  </div>
  ${lsection("Edges: colour is the relationship, dash is the mode", Object.keys(EDGE).map(k => `e:${k}`), Object.entries(EDGE).map(([k, s]) => lrow(`e:${k}`, `<svg width="44" height="10"><line x1="0" y1="5" x2="44" y2="5" stroke="${s.c}" stroke-width="${s.w + .4}" ${s.d ? `stroke-dasharray="${s.d}"` : ""}/></svg>`, s.label, edgeCount[k] ?? 0)).join(""))}
  ${DIFF ? lsection("Diff: a ring and a badge, in colours used for nothing else", ["d:changes"], lrow("d:changes", `<svg width="44" height="14"><line x1="0" y1="7" x2="44" y2="7" stroke="#22c55e" stroke-width="7" opacity=".45" stroke-linecap="round"/><line x1="0" y1="7" x2="44" y2="7" stroke="#2dd4bf" stroke-width="2"/></svg>`, "draw changed edges without hovering: the edge keeps its own colour, the glow says added, changed or removed", G.edges.filter(e => e.status !== "same").length)
    + `<div class="lrow fixed"><span class="chip k-eq d-added" style="pointer-events:none;margin:8px 0 2px 8px"><span class="d">+</span><span class="k">eq</span></span><span class="hint">added</span><span></span></div>
    <div class="lrow fixed"><span class="chip k-eq d-changed async" style="pointer-events:none;margin:8px 0 2px 8px"><span class="d">Δ</span><span class="k">eq</span><span class="g gp chg">⧗</span></span><span class="hint">changed: the mark that changed is underlined (here: became async)</span><span></span></div>
    <div class="lrow fixed"><span class="chip k-eq d-removed" style="pointer-events:none;margin:8px 0 2px 8px"><span class="d">−</span><span class="k">eq</span><span class="n">x</span></span><span class="hint">removed: keeps its role colour, ghosted (before / after is in the header)</span><span></span></div>`) : ""}
  <h4>Frames</h4><div class="rows">
    <div class="lrow fixed"><span class="hint" style="color:var(--comp)">component</span><span class="hint">${fam("structure")}owns everything declared in it</span><span></span></div>
    <div class="lrow fixed"><span class="frame then" style="border:0;padding:0;background:none"><span class="ctag">if c</span></span><span class="hint">sky, solid: created when <code>c</code> holds, disposed when it stops; else is the same</span><span></span></div>
    <div class="lrow fixed"><span class="frame for" style="border:0;padding:0;background:none;box-shadow:none"><span class="ctag">for x in xs</span></span><span class="hint">silver, stacked: one row per item, created and disposed with it</span><span></span></div>
    <div class="lrow fixed"><span class="frame loading" style="border:0;padding:0;background:none"><span class="ctag">loading</span></span><span class="hint">pending accent, dashed: shows its fallback while a reader inside is pending; lists who can make it</span><span></span></div>
    <div class="lrow fixed"><span class="frame errored" style="border:0;padding:0;background:none"><span class="ctag">errored</span></span><span class="hint">failure accent, dashed: shows its fallback when a reader inside fails; lists who can make it</span><span></span></div>
  </div></div>`;
function bindLegend() {
  panel.querySelectorAll(".lrow[data-key]").forEach(b => b.onclick = () => { const k = b.dataset.key; hidden.has(k) ? hidden.delete(k) : hidden.add(k); applyHidden(); });
  panel.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { b.dataset.all.split(",").forEach(k => hidden.delete(k)); applyHidden(); });
  panel.querySelectorAll("[data-none]").forEach(b => b.onclick = () => { b.dataset.none.split(",").forEach(k => hidden.add(k)); applyHidden(); });
}

// ---- live: a running dev build, posted in by @reactivescript/map/live ------------------------------------------------
// Messages carry the key a dev build names its Solid nodes with (`rx:<key>`), the same key as a named node here. A key
// this map does not have (a node from outside the program, an older build) is ignored.
const live = { ids: new Map(), values: new Map(), flying: new Map(), flushes: 0 };
if (LIVE) {
  for (const n of G.nodes) if (n.key && !n.site) (live.ids.get(n.key) ?? live.ids.set(n.key, []).get(n.key)).push(n.id);
  document.body.classList.add("live");
  const b = document.createElement("span");
  b.id = "liveBadge"; b.title = "attached to the running app: the flushes that changed something";
  document.querySelector("header h1").after(b);
  b.addEventListener("animationend", () => b.classList.remove("beat"));
  liveBadge();
  addEventListener("message", ev => { const d = ev.data; if (d && d.source === "rx-map") onLive(d); });
}
function liveBadge() {
  const b = document.getElementById("liveBadge");
  b.textContent = `live · ${live.flushes} flush${live.flushes === 1 ? "" : "es"}`;
}
function onLive(d) {
  if (d.type === "reset") {
    live.values.clear(); live.flying.clear(); live.flushes = 0;
    document.querySelectorAll("#board .chip.pulse, #board .chip.flying").forEach(c => c.classList.remove("pulse", "flying"));
    document.querySelectorAll("#board .chip .lv").forEach(s => s.remove());
    liveBadge(); liveValue(); return;
  }
  if (d.type === "flight") {
    if (!live.ids.has(d.key)) return;
    const k = live.flying.get(d.key) ?? 0;
    const next = d.state === "start" ? k + 1 : Math.max(0, k - 1);
    next ? live.flying.set(d.key, next) : live.flying.delete(d.key);
    for (const id of live.ids.get(d.key)) anchors.get(id)?.classList.toggle("flying", !!next);
    if (selected && nodes.get(selected)?.key === d.key) liveValue();
    return;
  }
  if (d.type !== "flush") return;
  live.flushes++;
  const b = document.getElementById("liveBadge");
  b.classList.remove("beat"); void b.offsetWidth; b.classList.add("beat");
  liveBadge();
  for (const c of d.changes ?? []) {
    if (!c || !live.ids.has(c.key)) continue;
    const v = live.values.get(c.key) ?? { count: 0 };
    v.count++; v.seq = d.seq; v.origin = c.origin ?? null;
    if (typeof c.preview === "string") v.preview = c.preview;
    live.values.set(c.key, v);
    for (const id of live.ids.get(c.key)) {
      const el = anchors.get(id);
      if (!el) continue;
      el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
      clearTimeout(el.rxPulse); el.rxPulse = setTimeout(() => el.classList.remove("pulse"), 1250);
      if (v.preview !== undefined) {
        const s = el.querySelector(".lv") ?? el.appendChild(Object.assign(document.createElement("span"), { className: "lv" }));
        s.textContent = v.preview; s.title = v.preview;
      }
    }
  }
  const k = selected && nodes.get(selected)?.key;
  if (k && (d.changes ?? []).some(c => c?.key === k)) liveValue();
}
// the selected name's "Live value" section, when it has one
function liveValue() {
  const box = document.getElementById("liveval");
  const n = selected && nodes.get(selected);
  if (!box || !n) return;
  const v = live.values.get(n.key), fly = live.flying.has(n.key);
  box.innerHTML = (v?.preview !== undefined ? `<pre class="mono"></pre>` : `<p class="hint">${v ? "changed; its value was not sent" : "No change seen since the map opened."}</p>`)
    + (v ? `<div class="hint">changed ${v.count}× · last in flush ${v.seq}<span class="origin"></span></div>` : "")
    + (fly ? `<div class="hint" style="color:var(--pending)">⧗ a request is in the air</div>` : "");
  if (box.querySelector("pre")) box.querySelector("pre").textContent = v.preview;
  if (v?.origin) box.querySelector(".origin").textContent = ` · by ${v.origin}`;
}

render();
renderPanel();
// #name selects a name; #name:down / #name:up also traces it
function fromHash() {
  const [name, dir] = decodeURIComponent(location.hash.slice(1)).split(":");
  if (!name) return;
  const n = G.nodes.find(n => n.name === name && !n.site) ?? G.nodes.find(n => n.name === name);
  if (!n) return;
  select(n.id, true);
  if (dir === "down" || dir === "up") { const [ids, edges] = dir === "down" ? downstream(n.id) : upstream(n.id); setFocus(ids, edges); }
}
addEventListener("hashchange", fromHash);
requestAnimationFrame(fromHash);
</script>
</body>
</html>
