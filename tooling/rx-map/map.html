<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rx-map · <!--__TITLE__--></title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --card: #1b2029; --line: #2a303b; --text: #e6e8ec; --dim: #8b93a3;
    --source: #4ea1ff; --asrc: #2dd4bf; --eq: #4ade80; --aeq: #fbbf24; --action: #fb923c; --fn: #a1a1aa;
    --server: #94a3b8; --context: #f472b6; --err: #f87171; --comp: #c084fc; --world: #e5e7eb; --site: #64748b;
    --effect: #a78bfa; --handler: #fda4af;
  }
  * { box-sizing: border-box }
  body { display: flex; flex-direction: column }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: nowrap; white-space: nowrap }
  header > * { flex-shrink: 0 }
  header h1 { flex-shrink: 1; min-width: 60px; overflow: hidden; text-overflow: ellipsis }
  header .stats { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: right }
  header .spacer { flex-shrink: 1; min-width: 0 }
  header h1 { font-size: 14px; margin: 0; font-weight: 600 }
  header h1 small { color: var(--dim); font-weight: 400; margin-left: 6px }
  header input[type=search] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; width: 200px }
  header label { color: var(--dim); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; user-select: none }
  header button, aside button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer }
  header button:hover, aside button:hover { border-color: var(--dim) }
  .spacer { flex: 1 }
  @media (max-width: 1100px) { header input[type=search] { width: 140px } }
  #wrap { display: flex; flex: 1; min-height: 0 }
  #canvas { flex: 1; overflow: auto; position: relative }
  #board { position: relative; padding: 16px 20px 80px; max-width: 1600px; margin: 0 auto }
  .level { display: grid; gap: 18px; margin-bottom: 22px; position: relative; z-index: 1 }
  .kids { display: grid; gap: 10px; margin-top: 10px; align-items: start }
  .kids > .frame { margin-top: 0 !important }
  .mounts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px }
  .mounts > .frame { margin-top: 0 !important }
  .chips.named + .chips.sites { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line) }
  .worldrow { margin-bottom: 22px; position: relative; z-index: 1 }
  .wgroups { display: flex; gap: 10px 26px; flex-wrap: wrap }
  .wfile { color: var(--dim); font-size: 11px; margin-bottom: 4px }
  svg#edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0 }
  aside { width: clamp(250px, 26vw, 360px); border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px; flex-shrink: 0; position: relative }
  aside.closed { display: none }
  aside { padding: 0 }
  #panel { padding: 12px 14px 14px }
  #ptabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2 }
  #ptabs [role=tab] { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--dim); padding: 9px 10px 7px; cursor: pointer; font: inherit; white-space: nowrap; flex-shrink: 0 }
  #ptabs [role=tab][data-tab=node] { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, monospace; font-size: 12px }
  #ptabs [role=tab][aria-selected=true] { color: var(--text); border-bottom-color: var(--text) }
  #ptabs [role=tab]:hover { color: var(--text) }
  #ptabs .close { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 18px; padding: 0 12px; cursor: pointer }
  #ptabs .close:hover { color: var(--text) }
  header button.on { border-color: var(--dim); background: var(--line) }
  aside h2 { margin: 0 0 2px; font-size: 16px; display: flex; gap: 8px; align-items: center }
  aside h3 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600 }
  aside pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 8px 0; white-space: pre-wrap; word-break: break-word }
  aside ul { list-style: none; margin: 0; padding: 0 }
  aside li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline }
  aside a { color: var(--source) }
  aside .hint { color: var(--dim) }
  aside .tag { font-size: 10px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim) }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px }

  .column { display: flex; flex-direction: column; gap: 14px; min-width: 260px; max-width: 520px; position: relative; z-index: 1 }
  .column > .title { font-weight: 600; color: var(--dim); font-size: 12px; padding: 0 2px }
  .column > .title b { color: var(--text) }
  .world { border: 1px dashed #4b5563; border-radius: 10px; padding: 10px; background: rgba(0,0,0,.15) }
  .world .title { margin-bottom: 6px }

  .frame { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 10px; background: rgba(255,255,255,.025); position: relative }
  .frame > .flabel { font-size: 11px; color: var(--dim); margin-bottom: 6px; display: flex; gap: 6px; align-items: center }
  .frame > .flabel b { color: var(--text); font-weight: 600; font-size: 12px }
  .frame .frame { background: rgba(255,255,255,.012) }
  .frame.component { border-color: color-mix(in srgb, var(--comp) 55%, transparent); border-width: 1.5px }
  .frame.component > .flabel { color: var(--comp) }
  .frame.loading { border: 1.5px dashed var(--aeq) } .frame.loading > .flabel { color: var(--aeq) }
  .frame.errored { border: 1.5px dashed var(--err) } .frame.errored > .flabel { color: var(--err) }
  .frame.for { box-shadow: 4px 4px 0 -1px var(--card), 4px 4px 0 0 var(--line) }
  .frame.then, .frame.else { border-style: dotted }
  .frame.children, .frame.imported { border-color: color-mix(in srgb, var(--comp) 35%, transparent); display: inline-block; padding: 3px 8px; border-radius: 6px }
  .frame.children > .flabel, .frame.imported > .flabel { margin: 0 }
  .frame.module { background: transparent; border-color: #3a4150 }
  .frame.module > .flabel b { font-family: ui-monospace, Menlo, monospace }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center }
  .chips + .chips { margin-top: 6px }
  .chip { --c: var(--site); display: inline-flex; gap: 5px; align-items: center; padding: 2px 8px 2px 6px; border-radius: 999px; cursor: pointer;
    background: color-mix(in srgb, var(--c) 16%, #161a21); border: 1.5px solid color-mix(in srgb, var(--c) 70%, transparent); color: var(--text);
    white-space: nowrap; transition: opacity .12s, box-shadow .12s; position: relative }
  .chip .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--c); font-weight: 700 }
  .chip .n { font-family: ui-monospace, Menlo, monospace; font-size: 12px }
  .chip .b { font-size: 9.5px; padding: 0 4px; border-radius: 4px; background: rgba(0,0,0,.35); color: var(--dim) }
  .chip.site { border-radius: 5px; border-style: solid; border-width: 1px; padding: 1px 6px }
  .chip.site .n { font-size: 11px }
  .chip.async { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 22%, #161a21) 0 5px, color-mix(in srgb, var(--c) 8%, #161a21) 5px 10px) }
  .chip:focus-visible { outline: 2px solid #fff; outline-offset: 2px }
  .chip.io::after { content: ""; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 2px var(--bg) }
  .chip.trust { border-style: dashed }
  .chip.hit { box-shadow: 0 0 0 2px #fff }
  .chip.sel { box-shadow: 0 0 0 2px #fff, 0 0 14px 2px color-mix(in srgb, var(--c) 70%, transparent) }
  .chip.compref { border-radius: 6px }
  body.focus #board .chip:not(.lit) { opacity: .3 }
  body.focus #board .frame > .flabel:not(.lit) { opacity: .35 }
  .flabel.lit { opacity: 1 }

  .k-source { --c: var(--source) } .k-asource { --c: var(--asrc) } .k-eq { --c: var(--eq) } .k-aeq { --c: var(--aeq) }
  .k-action { --c: var(--action) } .k-fn { --c: var(--fn) } .k-server { --c: var(--server) } .k-context { --c: var(--context) }
  .k-errclass { --c: var(--err) } .k-comp { --c: var(--comp) } .k-import { --c: var(--world) } .k-props { --c: var(--comp) }
  .k-handler { --c: var(--handler) } .k-effect, .k-apply { --c: var(--effect) } .k-reader, .k-prop, .k-provide { --c: var(--site) }

  .legend h4 { margin: 8px 0 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em }
  .legend h4:first-child { margin-top: 0 }
  .legend .grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center }
  .legend .grid > .chip { justify-self: start }
  .legend .rows { display: grid; gap: 1px }
  .lrow { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "sample cnt" "text text"; gap: 2px 8px; align-items: center; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 6px; color: inherit; font: inherit; cursor: pointer; width: 100% }
  .lrow > :first-child { grid-area: sample; justify-self: start }
  .lrow > .hint { grid-area: text; font-size: 12px; line-height: 1.35 }
  .lrow > :last-child { grid-area: cnt }
  .lrow:hover:not(.fixed):not(.none) { background: var(--card); border-color: var(--line) }
  .lrow.off > :first-child, .lrow.off .hint { opacity: .35 }
  .lrow.off .hint { text-decoration: line-through }
  .lrow .cnt { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums }
  .lrow.none { opacity: .4; cursor: default }
  .lrow.fixed { cursor: default }
  .legend h4 { display: flex; align-items: center; justify-content: space-between }
  .lall { display: inline-flex; gap: 4px; text-transform: none; letter-spacing: 0 }
  .lall button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 5px; padding: 0 6px; font-size: 11px; cursor: pointer }
  .lall button:hover { color: var(--text) }
  .legend svg { display: block }
  .stats { color: var(--dim); font-size: 12px }

  /* diff mode */
  .chip.d-added { box-shadow: 0 0 0 2px #22c55e; }
  .chip.d-changed { box-shadow: 0 0 0 2px #f59e0b; }
  .chip.d-removed { --c: #ef4444; border-style: dashed; opacity: .8 }
  .chip.d-removed .n { text-decoration: line-through }
  .chip .d { font-size: 10px; font-weight: 800; margin-left: -1px }
  .chip.d-added .d { color: #22c55e } .chip.d-changed .d { color: #f59e0b } .chip.d-removed .d { color: #ef4444 }
  .frame.d-added { border-color: #22c55e !important; border-style: solid }
  .frame.d-removed { border-color: #ef4444 !important; border-style: dashed; opacity: .8 }
  body.v-before .d-added, body.v-after .d-removed { display: none !important }
  #summary li { cursor: pointer; padding: 3px 4px; border-radius: 4px; display: block }
  #summary li:hover { background: var(--card) }
  #summary code { color: var(--text) }
  .was { color: #f59e0b }
  aside pre.before { border-color: #ef4444; opacity: .85 }
  #diffbar { display: none; gap: 6px; align-items: center }
  #hiddenBtn { color: #fbbf24 }
  body.diff #diffbar { display: inline-flex }
  #diffbar select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px }
</style>
</head>
<body>
<header>
  <h1>rx-map <small class="mono"><!--__TITLE__--></small></h1>
  <input type="search" id="q" placeholder="find a name…  (/)">
  <label><input type="checkbox" id="all"> all edges</label>
  <button id="hiddenBtn" hidden title="open the legend to show them again"></button>
  <span id="diffbar"><select id="view"><option value="both">before + after</option><option value="before">before</option><option value="after">after</option></select></span>
  <span class="spacer"></span>
  <span class="stats" id="stats"></span>
  <span id="panelBtns"></span>
</header>
<div id="wrap">
  <div id="canvas"><div id="board"><svg id="edges"></svg></div></div>
  <aside id="side"><div id="ptabs" role="tablist"></div><div id="panel" role="tabpanel"></div></aside>
</div>
<script>
const G = /*__GRAPH__*/null;

// ---- vocabulary ------------------------------------------------------------------------------------------------
const KIND = {
  source:  { k: "source", label: "source", what: "State. Only a source is written, with :=" },
  asource: { k: "source?", label: "source + question", what: "A source with a standing question (source x = await …): re-asks until written; can be pending" },
  eq:      { k: "eq", label: "equation", what: "x = e: always true, recomputes when what it reads changes" },
  aeq:     { k: "eq ⧗", label: "async equation", what: "An equation over an await: a question, can be pending and can fail" },
  action:  { k: "action", label: "action", what: "One change across its awaits; its writes are held until it returns" },
  fn:      { k: "fn", label: "function", what: "A plain function: lifted, or instantiated where it declares nodes" },
  server:  { k: "server fn", label: "server function", what: "Runs on the server; the call site decides query vs mutation" },
  context: { k: "context", label: "context", what: "Declared, provided above, used below; read-only" },
  errclass:{ k: "error", label: "error class", what: "A declared failure class (R-f-1); crosses the wire" },
  comp:    { k: "component", label: "component", what: "A region that owns everything declared in it" },
  props:   { k: "props", label: "props", what: "A component's inputs: one live structured equation" },
  import:  { k: "js", label: "JS import", what: "Outside the program: a JS module, trusted through pure / fails / .d.rx" },
  reader:  { k: "view", label: "view read", what: "A markup position that reads reactive values" },
  handler: { k: "on", label: "handler", what: "Imperative scope: every read is a snapshot, writes are legal" },
  prop:    { k: "prop", label: "prop passed", what: "A value handed to a child component" },
  effect:  { k: "effect", label: "effect", what: "Compute half tracked, apply half runs after the instant settles" },
  apply:   { k: "apply", label: "effect apply", what: "" },
  provide: { k: "provide", label: "provide", what: "Provides a context to the regions below" },
};
const FRAME = { component: "component", for: "for each", then: "if ▸ then", else: "else", loading: "loading", errored: "errored", children: "renders", imported: "renders (imported)" };
const EDGE = {
  "read:tracked":  { c: "#4ade80", d: "",      w: 1.6, label: "tracked read — points at what it reads; re-runs when that changes" },
  "read:snapshot": { c: "#9ca3af", d: "4 3",   w: 1.2, label: "snapshot read — value now, never re-runs" },
  "read:pre":      { c: "#9ca3af", d: "1 3",   w: 1.4, label: "pre — the value before its last change" },
  "read:probe":    { c: "#fbbf24", d: "2 3",   w: 1.4, label: "probe — latest / pending?, reads ahead, never holds" },
  "write:write":   { c: "#fb923c", d: "",      w: 1.8, label: "write :=" },
  "write:optimistic": { c: "#fb923c", d: "6 3", w: 1.8, label: "guess — shown now, confirmed or reverted by the answer" },
  "write:refresh": { c: "#22d3ee", d: "5 3",   w: 1.6, label: "refresh — re-asks the question" },
  "write:affects": { c: "#a78bfa", d: "1 3",   w: 1.8, label: "affects — marks it pending? for the action" },
  "write:provide": { c: "#f472b6", d: "",      w: 1.4, label: "provides a context" },
  "call":          { c: "#94a3b8", d: "",      w: 1.1, label: "calls" },
  "passes":        { c: "#c084fc", d: "3 2",   w: 1.3, label: "passes a prop" },
  "renders":       { c: "#c084fc", d: "",      w: 1.1, label: "renders a component" },
};
const edgeStyle = e => e.type === "read" ? EDGE[e.probe ? "read:probe" : `read:${e.mode}`] : e.type === "write" ? (EDGE[`write:${e.op}`] ?? EDGE["write:write"]) : EDGE[e.type];
const edgeGroup = e => (e.type === "passes" || e.type === "renders") ? "flow" : e.type;

// ---- model -----------------------------------------------------------------------------------------------------
const nodes = new Map(G.nodes.map(n => [n.id, n]));
const out = new Map(), inc = new Map();
for (const e of G.edges) { (out.get(e.from) ?? out.set(e.from, []).get(e.from)).push(e); (inc.get(e.to) ?? inc.set(e.to, []).get(e.to)).push(e); }
const kindOf = n => n.kind === "source" && n.question ? "asource" : n.kind === "eq" && n.async ? "aeq" : n.kind;
const regions = new Map(G.regions.map(r => [r.id, { ...r, kids: [], nodes: [] }]));
for (const r of regions.values()) if (r.parent && regions.has(r.parent)) regions.get(r.parent).kids.push(r);
const compRegion = new Map();  // comp node id → component region id
for (const n of G.nodes) {
  const r = regions.get(n.region);
  if (n.kind === "comp") {
    const cr = [...regions.values()].find(x => x.mod === n.mod && x.kind === "component" && x.name === n.name);
    if (cr) { compRegion.set(n.id, cr.id); continue; }
  }
  if (n.world && !n.from) continue;    // drawn in the world column
  (r ?? regions.get(`${n.mod}:r0`))?.nodes.push(n);
}
const label = id => nodes.get(id)?.name ?? (regions.get(id) ? `<${regions.get(id).name}/>` : id);
const DIFF = !!G.diff;
const lineOf = n => ((n.status === "removed" ? G.linesBefore : G.lines)?.[n.file]?.[n.line] ?? "").trim();
const STATUS = { added: "+", removed: "−", changed: "Δ" };

// ---- render ----------------------------------------------------------------------------------------------------
const board = document.getElementById("board"), svg = document.getElementById("edges");
const anchors = new Map();   // node or region id → element
const ORDER = ["props", "context", "source", "asource", "eq", "aeq", "action", "fn", "server", "errclass", "comp", "import"];

function chip(n) {
  const kk = kindOf(n), meta = KIND[kk] ?? { k: n.kind };
  const el = document.createElement("span");
  el.className = `chip k-${kk}` + (n.site ? " site" : "") + (n.async ? " async" : "") + (n.io ? " io" : "") + (n.world ? " trust" : "");
  const badges = [];
  if (n.flavor) badges.push(n.flavor);
  if (n.from) badges.push(n.from);
  if (n.site) badges.push(`L${n.line}`);
  el.innerHTML = `<span class="k">${meta.k}</span><span class="n"></span>${badges.map(b => `<span class="b"></span>`).join("")}`;
  el.querySelector(".n").textContent = n.site && n.name === "{…}" ? `{ ${readsOf(n) || shorten(lineOf(n))} }` : n.name;
  el.querySelectorAll(".b").forEach((b, i) => (b.textContent = badges[i]));
  el.title = `${meta.label ?? n.kind} · ${n.file}:${n.line}\n${lineOf(n)}`;
  if (n.status && n.status !== "same") {
    el.classList.add(`d-${n.status}`);
    const d = document.createElement("span"); d.className = "d"; d.textContent = STATUS[n.status]; el.prepend(d);
  } else if (n.edited) el.title += "\n(line edited)";
  el.dataset.id = n.id;
  el.setAttribute("role", "button");
  el.tabIndex = 0;
  el.setAttribute("aria-label", `${meta.label ?? n.kind} ${el.querySelector(".n").textContent}${n.status && n.status !== "same" ? `, ${n.status}` : ""}`);
  anchors.set(n.id, el);
  return el;
}
// a markup hole is named by what it reads: `{ total }`, `{ pending? users }`
function readsOf(n) {
  const names = (inc.get(n.id) ?? []).filter(e => e.type === "read").map(e => (e.probe === "pending" ? "pending? " : e.probe ? `${e.probe} ` : "") + label(e.from) + (e.field ? `.${e.field}` : ""));
  return [...new Set(names)].join(", ").slice(0, 34);
}
function shorten(s) { const m = s.match(/\{([^{}]{1,40})\}/); return (m ? m[1].trim() : s).slice(0, 28); }

// ---- layout: everything sits below what it depends on, so every arrow points up --------------------------------
// depends(x) = what x needs: what it reads, what it writes, what it calls, the props it passes into.
const deps = new Map();
for (const e of G.edges) {
  const [a, b] = e.type === "read" ? [e.to, e.from] : [e.from, e.to];
  if (!nodes.has(a) || !nodes.has(b) || a === b) continue;
  (deps.get(a) ?? deps.set(a, new Set()).get(a)).add(b);
}
const rankMemo = new Map(), onPath = new Set();
function rank(id) {
  if (rankMemo.has(id)) return rankMemo.get(id);
  if (onPath.has(id)) return 0;   // a cycle: break it here
  onPath.add(id);
  let r = 0;
  for (const d of deps.get(id) ?? []) r = Math.max(r, rank(d) + 1);
  onPath.delete(id);
  rankMemo.set(id, r);
  return r;
}
// components: one that renders another sits below it
const compOfRegion = new Map([...compRegion].map(([n, r]) => [r, n]));
function rendered(r, acc = new Set()) {
  for (const k of r.kids) {
    if (k.kind === "children" || k.kind === "imported") {
      const c = G.nodes.find(n => n.kind === "comp" && n.name === k.name && (n.mod === k.mod || !G.nodes.some(m => m.kind === "comp" && m.name === k.name && m.mod === k.mod)));
      if (c) acc.add(c.id);
    }
    rendered(k, acc);
  }
  return acc;
}
const compLevelMemo = new Map();
function compLevel(compId, path = new Set()) {
  if (compLevelMemo.has(compId)) return compLevelMemo.get(compId);
  if (path.has(compId)) return 0;
  path.add(compId);

  <p class="hint mono">${esc(G.diff.before)} → ${esc(G.diff.after)}</p>
  <p class="hint"><span style="color:#22c55e">+ added</span> · <span style="color:#ef4444">− removed</span> · <span style="color:#f59e0b">Δ changed</span>. Behaviour first: what each action can now reach, then what it writes and calls, then what was added or removed.</p>
  ${G.diff.summary.length ? `<ul id="summary">${G.diff.summary.map((it, i) => `<li data-i="${i}" role="button" tabindex="0">${md(it.text)}</li>`).join("")}</ul>` : `<p class="hint">No change the checker can see: the program reads, writes and calls the same things.</p>`}`;
  return `<h2>How to read this</h2>
  <p class="hint">Every name the checker resolved, in the region that owns it. Colour is what a thing <i>is</i>; a striped chip can be pending; a red dot touches the world (io); a dashed border is a trust point the checker cannot see into.</p>
  <p class="hint"><b>Everything points up.</b> A thing sits below what it depends on: modules below the modules they import, components below the components they render, equations below what they read, actions below what they write, handlers below the actions they call. Each row inside a frame is one step deeper.</p>
  <p class="hint">Hover a chip to see its edges. Click to pin it and trace <b>what it affects</b> (writes and tracked reads, the way a change travels) or <b>what it depends on</b>.</p>
  <p class="hint">Frames are regions: a <span style="color:var(--comp)">component</span>, <span style="color:var(--aeq)">loading</span> and <span style="color:var(--err)">errored</span> boundaries, <code>for</code> rows, <code>if</code> branches. Everything inside is created and disposed with it.</p>
  <p class="hint">All of this is static: it is what the program <i>can</i> do, from <code>rxc model</code>, with nothing running.</p>`;
}

// ---- interaction -----------------------------------------------------------------------------------------------
function clearSelection() {
  document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
  selected = null; setFocus(null);
}
function select(id, scroll) {
  if (!id) {
    const was = selected;
    clearSelection();
    if (was && tab === "node") { tab = before?.tab ?? TABS[0][0]; open = before?.open ?? false; before = null; }
    renderPanel(); return;
  }
  if (!selected && tab !== "node") before = { tab, open };
  document.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
  selected = id;
  const el = anchors.get(id);
  el?.classList.add("sel");
  if (scroll) el?.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
  const [ids, edges] = neighbourhood(id);
  setFocus(ids, edges);
  tab = "node"; open = true;
  renderPanel();
}
board.addEventListener("mouseover", ev => {
  const c = ev.target.closest("[data-id]"); if (!c || selected) return;
  const [ids, edges] = neighbourhood(c.dataset.id); setFocus(ids, edges);
});
board.addEventListener("mouseout", ev => { if (!selected && ev.target.closest("[data-id]")) setFocus(null); });
board.addEventListener("click", ev => {
  const c = ev.target.closest("[data-id]");
  if (c) select(c.dataset.id === selected ? null : c.dataset.id); else select(null);
});
document.getElementById("q").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  document.querySelectorAll(".chip.hit").forEach(c => c.classList.remove("hit"));
  if (!q) return;
  let first = null;
  for (const [id, el] of anchors) if (nodes.get(id)?.name?.toLowerCase().includes(q)) { el.classList.add("hit"); first ??= el; }
  first?.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
});
board.addEventListener("keydown", ev => {
  const c = ev.target.closest?.("[data-id]");
  if (c && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); select(c.dataset.id === selected ? null : c.dataset.id); }
});
board.addEventListener("focusin", ev => { const c = ev.target.closest?.("[data-id]"); if (c && !selected) { const [ids, edges] = neighbourhood(c.dataset.id); setFocus(ids, edges); } });
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement.tagName !== "INPUT") { ev.preventDefault(); document.getElementById("q").focus(); }
  if (ev.key === "Escape") { if (selected) select(null); else if (open) closePanel(); }
});
document.getElementById("all").onchange = redraw;
if (DIFF) {
  document.body.classList.add("diff");
  document.getElementById("view").onchange = ev => { document.body.classList.remove("v-before", "v-after"); if (ev.target.value !== "both") document.body.classList.add(`v-${ev.target.value}`); redraw(); };
}
new ResizeObserver(redraw).observe(board);

// ---- legend: every row is also a show / hide toggle -------------------------------------------------------------
const SHOW_KEY = "rx-map:hidden";
const hidden = new Set((() => { try { return JSON.parse(localStorage.getItem(SHOW_KEY) ?? "[]"); } catch { return []; } })());
const edgeKey = e => e.type === "read" ? (e.probe ? "read:probe" : `read:${e.mode}`) : e.type === "write" ? (EDGE[`write:${e.op}`] ? `write:${e.op}` : "write:write") : e.type;
const hideStyle = document.head.appendChild(document.createElement("style"));
function applyHidden() {
  hideStyle.textContent = [...hidden].filter(k => k.startsWith("k:")).map(k => `#board .chip.k-${k.slice(2)}:not(.compref) { display: none }`).join("\n");
  try { localStorage.setItem(SHOW_KEY, JSON.stringify([...hidden])); } catch {}
  const hb = document.getElementById("hiddenBtn");
  hb.hidden = !hidden.size; hb.textContent = `${hidden.size} hidden`;
  panel.querySelectorAll(".lrow[data-key]").forEach(b => { const off = hidden.has(b.dataset.key); b.classList.toggle("off", off); b.setAttribute("aria-pressed", String(!off)); });
  redraw();
}
document.getElementById("hiddenBtn").onclick = () => { if (selected) { before = null; clearSelection(); } openTab("legend"); };
const kindCount = {}, edgeCount = {};
for (const n of G.nodes) { const k = n.kind === "comp" ? "comp" : kindOf(n); kindCount[k] = (kindCount[k] ?? 0) + 1; }
for (const e of G.edges) { const k = edgeKey(e); edgeCount[k] = (edgeCount[k] ?? 0) + 1; }
function lrow(key, sample, text, count) {
  const off = hidden.has(key);
  return `<button class="lrow${off ? " off" : ""}${count ? "" : " none"}" data-key="${key}" aria-pressed="${!off}" ${count ? "" : "disabled"} title="${count ? "click to show or hide" : "none in this program"}">${sample}<span class="hint">${text}</span><span class="cnt">${count}</span></button>`;
}
const chipSample = (k, extra = "") => `<span class="chip k-${k} ${extra}" style="pointer-events:none"><span class="k">${KIND[k].k}</span></span>`;
const lsection = (title, keys, rows) => `<h4>${title}<span class="lall">${keys.length > 1 ? `<button data-all="${keys.join(",")}">all</button><button data-none="${keys.join(",")}">none</button>` : ""}</span></h4><div class="rows">${rows}</div>`;
const THINGS = ["source", "asource", "eq", "aeq", "action", "fn", "server", "context", "errclass", "props", "import"];
const SITES = ["reader", "handler", "prop", "effect", "provide"];
const legendHTML = () => `<div class="legend"><h2>Legend</h2>
  <p class="hint" style="margin-top:0">Click a row to show or hide it on the map.</p>
  ${lsection("Things", THINGS.map(k => `k:${k}`), THINGS.map(k => lrow(`k:${k}`, chipSample(k, k === "asource" || k === "aeq" ? "async" : k === "import" ? "trust" : ""), KIND[k].what, kindCount[k] ?? 0)).join("")
    + `<div class="lrow fixed">${chipSample("comp")}<span class="hint">${KIND.comp.what} (always shown)</span><span class="cnt">${kindCount.comp ?? 0}</span></div>`)}
  ${lsection("View sites", SITES.map(k => `k:${k}`), SITES.map(k => lrow(`k:${k}`, chipSample(k, "site"), KIND[k].what, kindCount[k] ?? 0)).join(""))}
  ${lsection("Edges", Object.keys(EDGE).map(k => `e:${k}`), Object.entries(EDGE).map(([k, s]) => lrow(`e:${k}`, `<svg width="44" height="10"><line x1="0" y1="5" x2="44" y2="5" stroke="${s.c}" stroke-width="${s.w + .4}" ${s.d ? `stroke-dasharray="${s.d}"` : ""}/></svg>`, s.label, edgeCount[k] ?? 0)).join(""))}
  ${DIFF ? lsection("Diff", ["d:changes"], lrow("d:changes", `<svg width="44" height="10"><line x1="0" y1="5" x2="44" y2="5" stroke="#22c55e" stroke-width="2"/></svg>`, "draw changed edges without hovering", G.edges.filter(e => e.status !== "same").length)
    + `<div class="lrow fixed"><span class="chip k-eq d-added" style="pointer-events:none"><span class="d">+</span><span class="k">eq</span></span><span class="hint">added</span><span></span></div>
    <div class="lrow fixed"><span class="chip k-eq d-changed" style="pointer-events:none"><span class="d">Δ</span><span class="k">eq</span></span><span class="hint">changed: what it is, async, io</span><span></span></div>
    <div class="lrow fixed"><span class="chip k-eq d-removed" style="pointer-events:none"><span class="d">−</span><span class="k">eq</span></span><span class="hint">removed (before / after is in the header)</span><span></span></div>`) : ""}
  <h4>Marks</h4><div class="rows">
    <div class="lrow fixed">${chipSample("eq", "async")}<span class="hint">striped: can be pending</span><span></span></div>
    <div class="lrow fixed">${chipSample("action", "io")}<span class="hint">red dot: io, touches the world</span><span></span></div>
    <div class="lrow fixed">${chipSample("import", "trust")}<span class="hint">dashed: a trust point (pure / fails / .d.rx)</span><span></span></div>
  </div>
  <h4>Frames</h4><div class="rows">
    <div class="lrow fixed"><span class="hint" style="color:var(--comp)">component</span><span class="hint">owns everything declared in it</span><span></span></div>
    <div class="lrow fixed"><span class="hint" style="color:var(--aeq)">loading</span><span class="hint">shows a fallback while what it reads is pending</span><span></span></div>
    <div class="lrow fixed"><span class="hint" style="color:var(--err)">errored</span><span class="hint">shows a fallback when what it reads fails</span><span></span></div>
    <div class="lrow fixed"><span class="hint">for each / if</span><span class="hint">a row or a branch: created and disposed with it</span><span></span></div>
  </div></div>`;
function bindLegend() {
  panel.querySelectorAll(".lrow[data-key]").forEach(b => b.onclick = () => { const k = b.dataset.key; hidden.has(k) ? hidden.delete(k) : hidden.add(k); applyHidden(); });
  panel.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { b.dataset.all.split(",").forEach(k => hidden.delete(k)); applyHidden(); });
  panel.querySelectorAll("[data-none]").forEach(b => b.onclick = () => { b.dataset.none.split(",").forEach(k => hidden.add(k)); applyHidden(); });
}

render();
renderPanel();
// #name selects a name; #name:down / #name:up also traces it
function fromHash() {
  const [name, dir] = decodeURIComponent(location.hash.slice(1)).split(":");
  if (!name) return;
  const n = G.nodes.find(n => n.name === name && !n.site) ?? G.nodes.find(n => n.name === name);
  if (!n) return;
  select(n.id, true);
  if (dir === "down" || dir === "up") { const [ids, edges] = dir === "down" ? downstream(n.id) : upstream(n.id); setFocus(ids, edges); }
}
addEventListener("hashchange", fromHash);
requestAnimationFrame(fromHash);
</script>
</body>
</html>
