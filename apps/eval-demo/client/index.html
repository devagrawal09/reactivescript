<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReactiveScript eval demo</title>
<style>
  :root { color-scheme: light dark; --muted: #888; --bad: #c33; --ok: #2a7; --line: #8884; }
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; }
  main { max-width: 1100px; margin: auto; display: grid; gap: 16px; grid-template-columns: 1fr 2fr; }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; margin: 0; } h2 { font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .result { grid-row: span 2; }
  .live { font-size: 12px; color: var(--muted); } .live.on { color: var(--ok); }
  .muted { color: var(--muted); font-size: 13px; }
  pre { background: #8881; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
  .markup { border: 1px dashed var(--line); padding: 8px; border-radius: 6px; }
  .value { font: 600 18px ui-monospace, monospace; }
  .errors { border-left: 3px solid var(--bad); padding-left: 8px; } .errors h3 { color: var(--bad); font-size: 14px; margin: 0; }
  .done { text-decoration: line-through; color: var(--muted); }
  .history ol { padding-left: 0; list-style: none; margin: 0; } .history li button { text-align: left; width: 100%; background: none; border: 0; padding: 4px; cursor: pointer; font: 12px ui-monospace, monospace; color: inherit; }
  .history li.sel button { background: #8882; } .history li.bad button { color: var(--bad); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } .result { grid-row: auto; } }
</style>
</head>
<body><div id="app"></div><script type="module" src="/app.js"></script></body>
</html>
