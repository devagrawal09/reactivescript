<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RX todos, evaluated live</title>
<style>
  :root { color-scheme: light dark; --muted: #888; --bad: #d44; --ok: #2a7; --pending: #c90; --line: #8884; }
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; }
  main { max-width: 1200px; margin: auto; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  header { grid-column: 1 / -1; } header p { margin: 4px 0 0; }
  h1 { font-size: 20px; margin: 0; } h3 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  h4 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .wide { grid-column: 1 / -1; }
  .muted { color: var(--muted); font-size: 13px; text-transform: none; letter-spacing: 0; }
  code, pre, textarea { font: 12px/1.5 ui-monospace, monospace; }
  pre { background: #8881; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  .reset { float: right; }
  .ok { color: var(--ok); font-size: 13px; }
  .errors { border-left: 3px solid var(--bad); padding-left: 8px; font-size: 13px; } .errors b { color: var(--bad); } .errors p { margin: 2px 0; }
  .server label { display: block; margin-bottom: 6px; } .fail { color: var(--bad); }
  .truth, .log { margin: 0; padding-left: 20px; font-size: 13px; } .truth .done { text-decoration: line-through; color: var(--muted); }
  .log li b { font-weight: 600; } .log .pending b { color: var(--pending); } .log .ok b { color: var(--ok); } .log .failed b { color: var(--bad); }

  /* The evaluated RX markup has no attributes, so it is styled by tag inside .eval. */
  .eval article h2 { font-size: 16px; margin: 0 0 8px; }
  .eval ul { list-style: none; padding: 0; margin: 0 0 12px; }
  .eval li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .eval li > span, .eval li > s, .eval li > i { flex: 1; }
  .eval li s { color: var(--muted); }
  .eval li i { color: var(--pending); }
  .eval li button { background: none; border: 0; cursor: pointer; font-size: 16px; color: inherit; padding: 0 4px; }
  .eval nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .eval nav button { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: none; color: inherit; cursor: pointer; }
  .eval em { display: block; margin-top: 10px; color: var(--bad); font-style: normal; min-height: 1.4em; }
  .eval { border: 1px dashed var(--line); border-radius: 6px; padding: 10px; }
  .rx-editor header { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .rx-editor header small { color: var(--muted); }
  .rx-editor textarea { display: block; width: 100%; box-sizing: border-box; min-height: 380px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: #8881; color: inherit; tab-size: 2; resize: vertical; }
  .self .rx-editor textarea { min-height: 260px; }
  .rx-editor p { color: var(--ok); font-size: 13px; margin: 6px 0 0; }
  .rx-editor pre { color: var(--bad); border-left: 3px solid var(--bad); margin: 6px 0 0; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body><div id="app"></div><script type="module" src="/app.js"></script></body>
</html>
